<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PK 車輪戰｜FINAL BATTLE 2026</title>
<meta name="theme-color" content="#02040a">
<style>
:root{--red:#ff263d;--blue:#168cff}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  font-family:"PingFang TC","Microsoft JhengHei",Arial,sans-serif
}
body{display:flex;align-items:center;justify-content:center}
.stage{
  position:relative;
  width:min(100vw,177.7777778vh);
  height:min(100vh,56.25vw);
  aspect-ratio:16/9;
  overflow:hidden;
  background:#02040a;
}
.stage::before,.stage::after{
  content:"";position:absolute;width:105%;height:190%;top:-45%;
  border-radius:50%;z-index:0;pointer-events:none
}
.stage::before{
  left:-56%;
  background:
    repeating-conic-gradient(from 0deg,transparent 0deg 7deg,rgba(255,35,55,.24) 8deg 12deg,transparent 13deg 24deg),
    radial-gradient(circle at center,rgba(255,32,50,.28) 0 11%,transparent 12% 27%,rgba(255,32,50,.13) 28% 29%,transparent 30%);
  filter:drop-shadow(0 0 22px rgba(255,30,48,.48));
  animation:redSpin 18s linear infinite
}
.stage::after{
  right:-56%;
  background:
    repeating-conic-gradient(from 0deg,transparent 0deg 7deg,rgba(22,140,255,.24) 8deg 12deg,transparent 13deg 24deg),
    radial-gradient(circle at center,rgba(22,140,255,.28) 0 11%,transparent 12% 27%,rgba(22,140,255,.13) 28% 29%,transparent 30%);
  filter:drop-shadow(0 0 22px rgba(22,140,255,.48));
  animation:blueSpin 21s linear infinite
}
@keyframes redSpin{to{transform:rotate(360deg)}}
@keyframes blueSpin{to{transform:rotate(-360deg)}}
@media (max-aspect-ratio:16/9){ .stage{width:100vw;height:56.25vw} }
@media (min-aspect-ratio:16/9){ .stage{width:177.7777778vh;height:100vh} }

/* ---------- top label ---------- */
.mode-label{
  position:absolute; z-index:13; top:3.1%; left:3.2%;
  padding:.48% 1.35%; color:#fff;
  font-size:clamp(13px,1.05vw,21px); font-weight:800; letter-spacing:.12em;
  background:linear-gradient(90deg,rgba(7,10,16,.92),rgba(8,20,40,.84));
  border:1px solid rgba(255,255,255,.30); border-left:3px solid var(--red);
  transform:skew(-8deg);
  box-shadow:0 0 14px rgba(255,38,61,.18);
}
.mode-label span{display:block;transform:skew(8deg)}

.back-link{
  position:absolute; z-index:13; top:3.1%; right:3.2%;
  color:#cfd6ee; font-size:clamp(11px,.85vw,16px); text-decoration:none;
  padding:.48% 1.1%; border:1px solid rgba(255,255,255,.25);
  background:rgba(7,10,16,.7); letter-spacing:.06em;
}

/* ---------- duel stage ---------- */
.duel{ position:absolute; inset:0; top:9%; bottom:13%; z-index:2; display:flex; }
.fighter-half{
  flex:1; position:relative; overflow:hidden; background:#080d15;
}
.fighter-half.left{ clip-path:polygon(0 0, 94% 0, 100% 100%, 0 100%); margin-right:-3%; }
.fighter-half.right{ clip-path:polygon(6% 0, 100% 0, 100% 100%, 0 100%); margin-left:-3%; }
.fighter-half img{
  width:100%; height:100%; object-fit:contain; object-position:center; display:block;
  filter:drop-shadow(0 18px 35px rgba(0,0,0,.7));
  opacity:0; transition:opacity .5s ease;
}
.fighter-half img.show{ opacity:1; }
.fighter-half .placeholder{
  width:100%; height:100%; display:grid; place-items:center; color:#7c8799; font-size:2.4vw;
}
.fighter-half.red-glow{ box-shadow: inset 0 0 60px rgba(255,38,61,.35); }
.fighter-half.blue-glow{ box-shadow: inset 0 0 60px rgba(22,140,255,.35); }

.fighter-info{
  position:absolute; z-index:5; bottom:0; padding:1.4% 2.2%;
  background:linear-gradient(to top, rgba(2,4,9,.92), transparent);
  width:100%;
}
.fighter-half.right .fighter-info{ text-align:right; }
.fighter-tag{
  font-size:clamp(11px,.95vw,18px); letter-spacing:.14em; color:#cfd6ee; margin-bottom:.3em;
}
.fighter-name{
  font-size:clamp(20px,2.6vw,44px); font-weight:900; font-style:italic; color:#fff;
  text-shadow:0 4px 14px rgba(0,0,0,.7);
}
.fighter-score{
  font-size:clamp(13px,1.15vw,22px); font-weight:800; color:#ffce54; margin-top:.35em;
}

.vs-badge{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:8;
  display:flex; align-items:center; justify-content:center;
  width:11%; aspect-ratio:1/1; min-width:56px;
  color:#fff; font-size:clamp(18px,2.1vw,36px); font-weight:900; font-style:italic;
  background:linear-gradient(180deg,#2a2f3c,#0c0f16);
  border:2px solid rgba(255,255,255,.55);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  box-shadow:0 0 30px rgba(255,255,255,.25);
}

/* ---------- progress dots ---------- */
.progress-row{
  position:absolute; left:0; right:0; bottom:2%; z-index:10;
  display:flex; justify-content:center; gap:.6%;
}
.dot{
  width:clamp(22px,2.6vw,40px); aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
  font-size:clamp(10px,.95vw,16px); font-weight:800; color:#8a94b8;
  background:#0c0f16; border:1px solid rgba(255,255,255,.22);
  clip-path:polygon(20% 0,80% 0,100% 50%,80% 100%,20% 100%,0 50%);
}
.dot.win{ background:rgba(79,217,149,.18); border-color:#4fd995; color:#4fd995; }
.dot.lose{ background:rgba(255,107,107,.14); border-color:#ff6b6b; color:#ff6b6b; }
.dot.current{ border-color:#ffce54; color:#ffce54; box-shadow:0 0 10px rgba(255,206,84,.5); }

/* ---------- winner banner ---------- */
.winner-banner{
  position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  background:radial-gradient(ellipse at center, rgba(10,14,24,.86), rgba(2,4,9,.97));
}
.winner-label{
  font-size:clamp(13px,1.3vw,22px); letter-spacing:.5em; color:#8ab4ff; margin-bottom:.6em;
}
.winner-name{
  font-size:clamp(30px,5vw,84px); font-weight:900; font-style:italic; color:#fff;
  text-shadow:0 0 40px rgba(90,160,255,.55);
}
.winner-score{
  font-size:clamp(16px,1.6vw,28px); color:#ffce54; margin-top:.6em; font-weight:800;
}

.empty-stage{
  position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center;
  color:#7c8799; font-size:clamp(14px,1.4vw,24px); text-align:center; padding:0 8%;
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="mode-label"><span>PK 車輪戰</span></div>
  <a class="back-link" href="display-players.html">← 返回選手登場</a>

  <div id="content"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCPkvZj2_Z7ZgiG0itfP2YCjTvDkaSaPew",
  authDomain: "beyblade-x-event.firebaseapp.com",
  projectId: "beyblade-x-event",
  storageBucket: "beyblade-x-event.firebasestorage.app",
  messagingSenderId: "866394169939",
  appId: "1:866394169939:web:a73222040a99a433425ca6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const content = document.getElementById('content');
const stage = document.getElementById('stage');

function esc(v = "") {
  return String(v).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[m]));
}

function renderEmpty() {
  content.innerHTML = `<div class="empty-stage">目前沒有進行中的 PK 場次<br>請至 pk-admin.html 抽取主賽手</div>`;
}

function renderActive(session) {
  const { champion, challengers, currentIndex, results } = session;
  const currentChallenger = challengers[currentIndex];
  const winsSoFar = results.filter(r => r.result === 'champion_win').length;

  const dotsHtml = challengers.map((c, i) => {
    const r = results[i];
    let cls = 'dot';
    if (r) cls += r.result === 'champion_win' ? ' win' : ' lose';
    else if (i === currentIndex) cls += ' current';
    return `<div class="${cls}">${i + 1}</div>`;
  }).join('');

  const champGlow = champion.cardStyle === 'blue' ? 'blue-glow' : 'red-glow';
  const chalGlow = currentChallenger.cardStyle === 'blue' ? 'blue-glow' : 'red-glow';

  content.innerHTML = `
    <div class="duel">
      <div class="fighter-half left ${champGlow}">
        <img class="show" src="${esc(champion.photoUrl)}" alt="${esc(champion.battleName)}">
        <div class="fighter-info">
          <p class="fighter-tag">👑 主賽手</p>
          <p class="fighter-name">${esc(champion.battleName)}</p>
          <p class="fighter-score">本場 ${winsSoFar} 勝</p>
        </div>
      </div>
      <div class="fighter-half right ${chalGlow}">
        <img class="show" src="${esc(currentChallenger.photoUrl)}" alt="${esc(currentChallenger.battleName)}">
        <div class="fighter-info">
          <p class="fighter-tag">第 ${currentIndex + 1} / ${challengers.length} 場挑戰者</p>
          <p class="fighter-name">${esc(currentChallenger.battleName)}</p>
        </div>
      </div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="progress-row">${dotsHtml}</div>
  `;
}

function renderCompleted(session) {
  const wins = session.results.filter(r => r.result === 'champion_win').length;
  const total = session.challengers.length;
  content.innerHTML = `
    <div class="winner-banner">
      <p class="winner-label">WINNER</p>
      <p class="winner-name">👑 ${esc(session.champion.battleName)}</p>
      <p class="winner-score">本場戰績　${wins} / ${total} 勝</p>
    </div>
  `;
}

onSnapshot(doc(db, 'pkSessions', 'current'), (snap) => {
  if (!snap.exists()) { renderEmpty(); return; }
  const session = snap.data();
  if (session.status === 'completed') renderCompleted(session);
  else renderActive(session);
}, err => {
  console.error(err);
  content.innerHTML = `<div class="empty-stage">無法讀取對戰資料</div>`;
});

document.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'f') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
  if (e.key.toLowerCase() === 'h') {
    stage.classList.toggle('hide-ui');
  }
});
</script>
</body>
</html>
