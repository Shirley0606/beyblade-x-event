<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FINAL BATTLE 2026｜AWARD CEREMONY</title>
<style>
:root{
  --gold:#d7b56e;
  --gold-soft:#f3dfb0;
  --gold-bright:#ffe9a7;
  --ink:#050608;
  --red:#d21a34;
  --blue:#1e7bff;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#040507;
}
body{
  position:fixed;
  inset:0;
  color:#fff;
  font-family:"Noto Serif TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
}
.stage{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% -12%, rgba(255,224,150,.14), transparent 28%),
    radial-gradient(circle at 12% 50%, rgba(210,26,52,.28), transparent 22%),
    radial-gradient(circle at 88% 50%, rgba(30,123,255,.28), transparent 22%),
    linear-gradient(90deg,#2e0710 0%,#12070b 16%,#070708 36%,#070809 64%,#08101b 84%,#0a2141 100%);
}
.stage::before{
  content:"";
  position:absolute;inset:-6% -2%;
  pointer-events:none;
  background:
    repeating-linear-gradient(120deg, rgba(255,255,255,.018) 0 26px, transparent 26px 74px),
    linear-gradient(115deg, transparent 0 18%, rgba(255,219,146,.05) 28%, transparent 36%),
    linear-gradient(65deg, transparent 0 20%, rgba(255,219,146,.04) 31%, transparent 40%),
    radial-gradient(ellipse at 50% 108%, rgba(214,169,95,.14), transparent 40%);
  mix-blend-mode:screen;
}
.stage::after{
  content:"";
  position:absolute;inset:0;
  pointer-events:none;
  box-shadow:inset 0 0 140px rgba(0,0,0,.72);
}
.side-red,.side-blue{
  position:absolute;top:0;bottom:0;width:23%;pointer-events:none;z-index:1;opacity:.95;
}
.side-red{
  left:0;
  background:
    linear-gradient(90deg,rgba(115,7,25,.86),rgba(65,4,14,.56) 58%,transparent),
    repeating-linear-gradient(118deg, rgba(255,53,83,.12) 0 22px, rgba(0,0,0,0) 22px 58px);
  clip-path:polygon(0 0,100% 0,72% 100%,0 100%);
}
.side-blue{
  right:0;
  background:
    linear-gradient(270deg,rgba(12,47,104,.86),rgba(7,20,38,.56) 58%,transparent),
    repeating-linear-gradient(62deg, rgba(52,129,255,.12) 0 22px, rgba(0,0,0,0) 22px 58px);
  clip-path:polygon(28% 0,100% 0,100% 100%,0 100%);
}
.sparkle-layer,
.confetti-layer{
  position:absolute;inset:0;pointer-events:none;z-index:2;
}
.sparkle-layer{
  background:
    radial-gradient(circle at 12% 18%, rgba(255,224,153,.9) 0 1px, transparent 2.2px),
    radial-gradient(circle at 18% 12%, rgba(255,224,153,.9) 0 1px, transparent 2.2px),
    radial-gradient(circle at 50% 10%, rgba(255,224,153,.9) 0 1.4px, transparent 2.8px),
    radial-gradient(circle at 72% 17%, rgba(255,224,153,.82) 0 1px, transparent 2.2px),
    radial-gradient(circle at 84% 13%, rgba(255,224,153,.82) 0 1px, transparent 2.2px),
    radial-gradient(circle at 90% 28%, rgba(255,224,153,.7) 0 1px, transparent 2.2px),
    radial-gradient(circle at 25% 28%, rgba(255,224,153,.72) 0 1px, transparent 2.2px),
    radial-gradient(circle at 76% 35%, rgba(255,224,153,.72) 0 1px, transparent 2.2px);
  filter:drop-shadow(0 0 8px rgba(255,220,140,.28));
}
.confetti-layer{
  background:
    linear-gradient(135deg, transparent 0 91%, rgba(255,208,120,.95) 91% 100%) 10% 16%/18px 18px no-repeat,
    linear-gradient(135deg, transparent 0 91%, rgba(255,208,120,.9) 91% 100%) 32% 10%/12px 12px no-repeat,
    linear-gradient(135deg, transparent 0 91%, rgba(255,208,120,.95) 91% 100%) 66% 12%/14px 14px no-repeat,
    linear-gradient(135deg, transparent 0 91%, rgba(255,208,120,.9) 91% 100%) 82% 18%/16px 16px no-repeat,
    linear-gradient(135deg, transparent 0 91%, rgba(255,208,120,.92) 91% 100%) 93% 26%/11px 11px no-repeat;
  opacity:.72;
}
.header{
  position:absolute;
  top:4.2%;
  left:50%;
  transform:translateX(-50%);
  width:min(78vw,1200px);
  text-align:center;
  z-index:10;
}
.header .line1,
.header .line2{
  margin:0;
  color:var(--gold-soft);
  font-family:Georgia, "Times New Roman", serif;
  font-weight:800;
  text-transform:uppercase;
  text-shadow:0 0 18px rgba(255,214,126,.18), 0 3px 20px rgba(0,0,0,.45);
}
.header .line1{
  font-size:clamp(28px,3.8vw,68px);
  letter-spacing:.08em;
}
.header .line2{
  font-size:clamp(24px,3.1vw,52px);
  letter-spacing:.09em;
  margin-top:.3vh;
}
.header .thankyou{
  margin-top:1.15vh;
  color:#e6ca87;
  font:700 clamp(11px,.85vw,16px)/1.2 Arial,sans-serif;
  letter-spacing:.34em;
  text-transform:uppercase;
  white-space:nowrap;
}
.header .rule{
  width:min(56vw,860px);
  height:1px;
  margin:1.2vh auto 0;
  background:linear-gradient(90deg,transparent,rgba(230,198,126,.28) 18%,rgba(255,228,162,.78) 50%,rgba(230,198,126,.28) 82%,transparent);
}
.main{
  position:absolute;
  z-index:8;
  left:6.5%;
  right:6.5%;
  top:22%;
  bottom:9%;
  display:grid;
  grid-template-columns:minmax(520px,1.02fr) minmax(360px,.98fr);
  gap:4.5%;
  align-items:center;
}
.visual-area{
  position:relative;
  min-width:0;
  height:100%;
}
.visual-shell{
  position:relative;
  width:100%;
  height:100%;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.burst{
  position:absolute;
  left:6%;
  right:14%;
  top:8%;
  bottom:14%;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 54%, rgba(255,214,113,.44) 0 6%, rgba(255,214,113,.18) 15%, rgba(255,214,113,0) 52%),
    repeating-conic-gradient(from 0deg at 50% 54%, rgba(255,214,113,.45) 0deg 2.8deg, rgba(255,214,113,0) 3.8deg 14deg),
    radial-gradient(circle at 50% 54%, rgba(255,229,162,.45), rgba(255,229,162,0) 62%);
  filter:blur(.15px) drop-shadow(0 0 34px rgba(255,205,100,.34));
  opacity:.96;
}
.gold-dust{
  position:absolute;
  inset:10% 12% 16% 8%;
  z-index:2;
  pointer-events:none;
  background:
    radial-gradient(circle at 22% 48%, rgba(255,224,153,.88) 0 1.2px, transparent 2.6px),
    radial-gradient(circle at 36% 28%, rgba(255,224,153,.82) 0 1.2px, transparent 2.6px),
    radial-gradient(circle at 61% 36%, rgba(255,224,153,.75) 0 1.2px, transparent 2.6px),
    radial-gradient(circle at 73% 58%, rgba(255,224,153,.82) 0 1.2px, transparent 2.6px),
    radial-gradient(circle at 48% 70%, rgba(255,224,153,.78) 0 1.2px, transparent 2.6px),
    radial-gradient(circle at 59% 50%, rgba(255,224,153,.9) 0 1px, transparent 2.2px);
  filter:drop-shadow(0 0 8px rgba(255,220,140,.35));
}
#photoWrap{
  position:relative;
  z-index:3;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}
#photoWrap img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  display:block;
  filter:drop-shadow(0 18px 28px rgba(0,0,0,.38));
}
.photo-placeholder{
  display:grid;
  place-items:center;
  width:min(76%,680px);
  aspect-ratio:16/9;
  border:1px dashed rgba(255,231,177,.16);
  color:rgba(255,238,200,.34);
  font-size:clamp(38px,4.5vw,80px);
  font-weight:800;
  letter-spacing:.08em;
}
.stage-ring{
  position:absolute;
  left:8%;right:18%;bottom:3%;height:18%;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 55%, rgba(255,205,98,.34) 0 14%, rgba(255,205,98,.14) 18%, rgba(255,205,98,0) 48%),
    radial-gradient(ellipse at 50% 76%, rgba(255,198,79,.42) 0 13%, rgba(255,198,79,0) 38%);
  filter:blur(.3px);
}
.info-area{
  position:relative;
  z-index:4;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:1vh 0 1vh 1vw;
}
.info-area::before{
  content:"";
  position:absolute;
  inset:8% -6% 8% 12%;
  background:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.18) 20%, rgba(0,0,0,.34) 40%, rgba(0,0,0,.12) 82%, rgba(0,0,0,0));
  filter:blur(14px);
  z-index:-1;
}
.label{
  color:#cfb370;
  font:700 clamp(12px,.9vw,17px)/1.2 Arial,sans-serif;
  letter-spacing:.34em;
  text-transform:uppercase;
  margin-bottom:1.8vh;
}
#awardTitle{
  margin:0;
  color:#f7e2ae;
  font-size:clamp(54px,5.8vw,102px);
  line-height:1.02;
  font-weight:900;
  letter-spacing:.05em;
  text-shadow:
    0 0 18px rgba(255,224,130,.22),
    0 0 2px rgba(255,255,255,.38),
    0 3px 24px rgba(0,0,0,.65);
}
.title-rule{
  width:78%;
  height:1px;
  margin:2.4vh 0 2.2vh;
  background:linear-gradient(90deg, rgba(255,221,142,.92) 0%, rgba(255,221,142,.32) 56%, rgba(255,221,142,0) 100%);
}
#awardNote{
  color:#f0d791;
  font-size:clamp(30px,2.55vw,46px);
  line-height:1.35;
  font-weight:600;
  letter-spacing:.06em;
  text-shadow:0 3px 18px rgba(0,0,0,.42);
}
#awardNote::before{content:"「"}
#awardNote::after{content:"」"}
.signature-block{
  margin-top:4.2vh;
  display:flex;
  align-items:center;
  gap:1.2vw;
}
.signature-block .mini-rule{
  flex:0 0 14%;
  height:1px;
  background:linear-gradient(90deg, rgba(255,221,142,.82), rgba(255,221,142,.06));
}
.signature-block .mini-crown{
  width:26px;height:18px;opacity:.86;flex:0 0 auto;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 44'><path fill='%23d7b56e' d='M5 36h54l-4-18-13 7-10-16-10 16-13-7z'/><rect x='10' y='36' width='44' height='5' rx='2' fill='%23d7b56e'/><circle cx='19' cy='12' r='4' fill='%23f3dfb0'/><circle cx='32' cy='6' r='4' fill='%23f3dfb0'/><circle cx='45' cy='12' r='4' fill='%23f3dfb0'/></svg>") center/contain no-repeat;
}
.signature{
  color:#b79b62;
  font:700 clamp(10px,.75vw,13px)/1.2 Arial,sans-serif;
  letter-spacing:.28em;
  text-transform:uppercase;
}
#namePlate{
  position:absolute;
  left:18%;
  bottom:6.4%;
  z-index:4;
  min-width:240px;
  max-width:46%;
  padding:1.2vh 2.2vw;
  text-align:center;
  color:#f6dfaa;
  font-size:clamp(30px,3.2vw,56px);
  font-weight:900;
  letter-spacing:.12em;
  background:linear-gradient(180deg, rgba(25,18,10,.96), rgba(7,7,9,.97));
  border:2px solid rgba(242,201,112,.96);
  clip-path:polygon(6% 0,94% 0,100% 50%,94% 100%,6% 100%,0 50%);
  box-shadow:0 0 0 1px rgba(84,58,18,.7) inset, 0 8px 24px rgba(0,0,0,.38), 0 0 16px rgba(255,212,117,.18);
}
.back-battle{
  position:absolute;z-index:20;right:1.4%;top:1.8%;
  border:1px solid rgba(215,180,106,.16);
  background:rgba(7,8,10,.22);
  color:#9f8a5b;
  padding:.52em .82em;border-radius:8px;
  font-size:clamp(8px,.6vw,11px);cursor:pointer;opacity:.28;
}
.back-battle:hover{opacity:.9}
.empty-stage .main{opacity:0;pointer-events:none}
.main.reveal{animation:reveal .55s cubic-bezier(.2,.75,.15,1)}
@keyframes reveal{
  from{opacity:0;transform:translateY(10px) scale(.992)}
  to{opacity:1;transform:none}
}
@media (max-aspect-ratio: 4/3){
  .main{left:4%;right:4%;gap:2.4%;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr)}
  #awardTitle{font-size:clamp(48px,5vw,86px)}
  #awardNote{font-size:clamp(24px,2.3vw,40px)}
  #namePlate{left:14%;max-width:54%}
}
@media (max-width: 920px){
  .header{width:94%}
  .header .line1{font-size:clamp(26px,8vw,52px)}
  .header .line2{font-size:clamp(22px,6.8vw,44px)}
  .header .thankyou{font-size:clamp(10px,2.4vw,14px);letter-spacing:.18em}
  .main{
    top:18%;bottom:4%;left:4%;right:4%;
    display:flex;flex-direction:column;gap:2vh;justify-content:flex-start;
  }
  .visual-area{width:100%;height:54%}
  .info-area{width:100%;padding:0 .5vw;text-align:center;align-items:center}
  .info-area::before{inset:8% 0 10% 0}
  .title-rule{width:56%;margin:1.8vh auto}
  .signature-block{justify-content:center}
  #awardTitle{font-size:clamp(36px,8vw,60px)}
  #awardNote{font-size:clamp(18px,4vw,28px)}
  #namePlate{left:50%;transform:translateX(-50%);bottom:1.6%;max-width:72%;min-width:160px;padding:10px 20px;font-size:clamp(24px,5.2vw,38px)}
  .stage-ring{left:6%;right:10%;bottom:1%}
  .back-battle{display:none}
}
</style>
</head>
<body>
<main class="stage empty-stage" id="stage">
  <div class="side-red"></div>
  <div class="side-blue"></div>
  <div class="sparkle-layer"></div>
  <div class="confetti-layer"></div>

  <header class="header">
    <h1 class="line1">FINAL BATTLE 2026</h1>
    <h2 class="line2">AWARD CEREMONY</h2>
    <div class="thankyou">THANK YOU FOR BEING AWESOME!</div>
    <div class="rule"></div>
  </header>

  <section class="main" id="awardMain">
    <div class="visual-area">
      <div class="visual-shell">
        <div class="burst"></div>
        <div class="gold-dust"></div>
        <div id="photoWrap"><div class="photo-placeholder">FINAL BATTLE</div></div>
        <div class="stage-ring"></div>
        <div id="namePlate">旋風熙熙</div>
      </div>
    </div>

    <div class="info-area">
      <div class="label">SPECIAL RECOGNITION</div>
      <h2 id="awardTitle">冠軍陀螺手</h2>
      <div class="title-rule"></div>
      <div id="awardNote">稱霸決鬥的王者</div>
      <div class="signature-block">
        <div class="mini-rule"></div>
        <div class="mini-crown"></div>
        <div class="mini-rule"></div>
      </div>
      <div class="signature">FINAL BATTLE 2026 · HONOR THE MOMENT</div>
    </div>
  </section>

  <button class="back-battle" id="backBattle" type="button">返回比賽</button>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCPkvZj2_Z7ZgiG0itfP2YCjTvDkaSaPew",
  authDomain:"beyblade-x-event.firebaseapp.com",
  projectId:"beyblade-x-event",
  storageBucket:"beyblade-x-event.firebasestorage.app",
  messagingSenderId:"866394169939",
  appId:"1:866394169939:web:a73222040a99a433425ca6"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const stage=document.getElementById("stage");
const awardMain=document.getElementById("awardMain");
const photoWrap=document.getElementById("photoWrap");
const awardTitle=document.getElementById("awardTitle");
const awardNote=document.getElementById("awardNote");
const namePlate=document.getElementById("namePlate");

let players=[];

function esc(v=""){
  return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function displayName(p){return p?.battleName||p?.name||"參賽者"}

function render(){
  const p=players.find(x=>x.awardProjected===true);
  if(!p){
    stage.classList.add("empty-stage");
    return;
  }
  stage.classList.remove("empty-stage");

  const label=displayName(p);
  namePlate.textContent=label;
  photoWrap.innerHTML=p.photoUrl
    ? `<img src="${esc(p.photoUrl)}" alt="${esc(label)}">`
    : `<div class="photo-placeholder">${esc(label.slice(0,1))}</div>`;

  awardTitle.textContent=p.awardTitle || "傳奇陀螺手";
  awardNote.textContent=p.awardNote || "站上巔峰的傳說";

  awardMain.classList.remove("reveal");
  void awardMain.offsetWidth;
  awardMain.classList.add("reveal");
}

onSnapshot(collection(db,"players"),snap=>{
  players=[];
  snap.forEach(d=>players.push({id:d.id,...d.data()}));
  render();
},err=>console.error("[AWARDS LIVE] Firebase 監聽失敗：",err));

document.getElementById("backBattle")?.addEventListener("click",()=>{
  if(window.parent!==window){
    window.parent.postMessage({type:"projector:navigate",url:"battle.html"},"*");
  }else{
    window.location.href="battle.html";
  }
});
</script>
</body>
</html>
