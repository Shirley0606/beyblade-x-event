<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FINAL BATTLE 2026｜頒獎典禮</title>
<style>
:root{
  --gold:#d8b46a;
  --gold2:#f5dfaa;
  --champagne:#fff2cf;
  --wine:#3a0810;
  --ink:#070709;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050506}
body{
  position:fixed;inset:0;
  font-family:"Noto Serif TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  color:#fff;
}
.stage{
  position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% -8%,rgba(255,224,158,.12),transparent 38%),
    linear-gradient(120deg,#24050b 0%,#0c0a0c 29%,#060607 58%,#0b0c10 77%,#101725 100%);
}
.stage::before{
  content:"";
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(108deg,transparent 0 34%,rgba(255,226,164,.055) 39%,transparent 44%),
    linear-gradient(72deg,transparent 0 36%,rgba(255,226,164,.05) 41%,transparent 46%),
    radial-gradient(ellipse at 50% 105%,rgba(184,123,40,.13),transparent 42%);
}
.stage::after{
  content:"";
  position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 150px rgba(0,0,0,.82);
}
.curtain-left,.curtain-right{
  position:absolute;top:0;bottom:0;width:21%;z-index:1;opacity:.66;pointer-events:none;
  filter:saturate(.85);
}
.curtain-left{
  left:0;
  background:
    linear-gradient(90deg,rgba(77,5,17,.95),rgba(48,4,12,.72) 58%,transparent),
    repeating-linear-gradient(104deg,rgba(155,22,41,.12) 0 22px,rgba(0,0,0,.06) 23px 50px);
  clip-path:polygon(0 0,100% 0,72% 100%,0 100%);
}
.curtain-right{
  right:0;
  background:
    linear-gradient(270deg,rgba(23,27,42,.95),rgba(13,17,28,.72) 58%,transparent),
    repeating-linear-gradient(76deg,rgba(69,86,130,.10) 0 22px,rgba(0,0,0,.06) 23px 50px);
  clip-path:polygon(0 0,100% 0,100% 100%,28% 100%);
}
.ceiling-lights{
  position:absolute;left:0;right:0;top:0;height:28%;z-index:2;pointer-events:none;
  background:
    radial-gradient(circle at 18% 10%,rgba(255,225,166,.75) 0 1px,transparent 2px),
    radial-gradient(circle at 32% 6%,rgba(255,225,166,.75) 0 1px,transparent 2px),
    radial-gradient(circle at 68% 6%,rgba(255,225,166,.75) 0 1px,transparent 2px),
    radial-gradient(circle at 82% 10%,rgba(255,225,166,.75) 0 1px,transparent 2px);
  filter:drop-shadow(0 0 8px rgba(255,210,125,.8));
}
.header{
  position:absolute;z-index:10;top:3.8%;left:50%;transform:translateX(-50%);
  width:72%;text-align:center;
}
.kicker{
  color:#d9bf84;
  font-family:"Arial Narrow",Arial,sans-serif;
  font-size:clamp(10px,.8vw,15px);
  font-weight:700;letter-spacing:.38em;
}
.title{
  margin:.65vh 0 0;
  color:#f4e1b4;
  font-size:clamp(38px,4.7vw,80px);
  line-height:1;
  font-weight:900;
  letter-spacing:.12em;
  text-shadow:0 4px 20px rgba(0,0,0,.65);
}
.header-rule{
  width:34%;height:1px;margin:1.7vh auto 0;
  background:linear-gradient(90deg,transparent,#d6b265 22%,#f3d99d 50%,#d6b265 78%,transparent);
}
.header-sub{
  margin-top:1vh;
  color:#9f8b61;
  font-size:clamp(9px,.66vw,12px);
  letter-spacing:.22em;
}
.main{
  position:absolute;z-index:8;
  left:10%;right:10%;top:25%;bottom:10%;
  display:grid;
  grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);
  gap:5.2%;
  align-items:center;
}
.photo-panel{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  max-height:100%;
  padding:10px;
  background:linear-gradient(145deg,#39250f,#d5b15f 12%,#6f4d1a 22%,#19120b 35%,#5e431c 68%,#d5b15f 87%,#39250f);
  box-shadow:
    0 20px 55px rgba(0,0,0,.58),
    0 0 32px rgba(216,180,106,.16);
}
.photo-panel::before{
  content:"";
  position:absolute;inset:3px;
  border:1px solid rgba(255,242,207,.34);
  pointer-events:none;
}
.photo-inner{
  position:relative;width:100%;height:100%;
  background:
    radial-gradient(circle at 50% 45%,rgba(214,178,95,.08),transparent 36%),
    #050506;
  overflow:hidden;
}
#photoWrap{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
}
#photoWrap img{
  width:100%;height:100%;
  object-fit:contain;object-position:center;
  display:block;
}
.photo-placeholder{
  width:100%;height:100%;display:grid;place-items:center;
  color:rgba(230,207,155,.25);
  font-size:clamp(28px,4vw,68px);font-weight:800;letter-spacing:.08em;
}
.award-panel{
  min-width:0;
  display:flex;flex-direction:column;justify-content:center;
  padding:2vh 0 2vh 1vw;
}
.award-label{
  color:#aa915e;
  font-family:Arial,sans-serif;
  font-size:clamp(9px,.72vw,13px);
  font-weight:700;
  letter-spacing:.32em;
  margin-bottom:2.2vh;
}
#awardTitle{
  margin:0;
  color:#f5e4bd;
  font-size:clamp(42px,4.7vw,82px);
  line-height:1.08;
  font-weight:900;
  letter-spacing:.06em;
  text-shadow:0 5px 24px rgba(0,0,0,.72);
  word-break:keep-all;
}
.gold-line{
  height:1px;width:82%;margin:2.8vh 0;
  background:linear-gradient(90deg,#e0bf79,rgba(224,191,121,.26),transparent);
}
#awardNote{
  max-width:90%;
  color:#d8c59a;
  font-size:clamp(21px,2vw,36px);
  line-height:1.5;
  font-weight:600;
  letter-spacing:.06em;
}
#awardNote::before{content:"「"}
#awardNote::after{content:"」"}
.signature{
  margin-top:4vh;
  color:#6f6248;
  font-size:clamp(9px,.65vw,12px);
  letter-spacing:.24em;
  font-family:Arial,sans-serif;
}
.floor{
  position:absolute;z-index:4;left:12%;right:12%;bottom:3.2%;height:5.5%;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(223,183,99,.24),transparent 58%),
    linear-gradient(180deg,rgba(142,101,39,.34),rgba(31,24,17,.2));
  border-top:1px solid rgba(215,180,106,.36);
  clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);
}
.brand{
  position:absolute;z-index:12;left:2.1%;top:2.4%;
  color:#c8b180;font-family:Arial,sans-serif;font-size:clamp(9px,.66vw,12px);font-weight:700;letter-spacing:.18em;
}
.brand strong{display:block;color:#f0dfb8;font-size:1.3em;letter-spacing:.06em;margin-bottom:3px}
.back-battle{
  position:absolute;z-index:20;right:1.6%;top:1.8%;
  border:1px solid rgba(215,180,106,.22);
  background:rgba(8,8,10,.45);
  color:#9d8960;
  padding:.5em .8em;border-radius:6px;
  font-size:clamp(8px,.6vw,11px);cursor:pointer;opacity:.45
}
.back-battle:hover{opacity:1}
.empty-stage .main{opacity:0;pointer-events:none}
.empty-stage .floor{opacity:.4}

/* selected-player entrance */
.main.reveal{animation:reveal .65s cubic-bezier(.2,.75,.15,1)}
@keyframes reveal{
  from{opacity:0;transform:translateY(10px) scale(.992)}
  to{opacity:1;transform:none}
}

@media(max-aspect-ratio:4/3){
  .main{left:5%;right:5%;gap:3.5%;grid-template-columns:1fr .85fr}
  .header{width:86%}
}
@media(max-width:760px){
  .brand{display:none}
  .header{top:2.3%;width:94%}
  .title{font-size:clamp(31px,9vw,54px)}
  .header-sub{display:none}
  .main{
    top:21%;bottom:4%;left:4%;right:4%;
    grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;
    gap:2vh;
  }
  .photo-panel{width:min(100%,72vh);justify-self:center}
  .award-panel{text-align:center;align-items:center;padding:0}
  .award-label{margin-bottom:1vh}
  #awardTitle{font-size:clamp(29px,8vw,50px)}
  .gold-line{width:54%;margin:1.4vh 0}
  #awardNote{font-size:clamp(16px,4vw,25px);max-width:95%}
  .signature{display:none}
  .floor{display:none}
}

/* ===== V9：正式典禮感 + 紅藍賽事一致性 ===== */
.stage{
  background:
    radial-gradient(ellipse at 50% -10%,rgba(255,224,158,.15),transparent 36%),
    radial-gradient(circle at 13% 48%,rgba(195,12,34,.18),transparent 22%),
    radial-gradient(circle at 87% 48%,rgba(20,94,202,.20),transparent 22%),
    linear-gradient(115deg,#3a0710 0%,#12090d 26%,#070708 50%,#08101c 73%,#0a244b 100%) !important;
}
.stage::before{
  background:
    linear-gradient(110deg,transparent 0 30%,rgba(255,228,168,.055) 35%,transparent 40%),
    linear-gradient(70deg,transparent 0 30%,rgba(255,228,168,.05) 35%,transparent 40%),
    repeating-conic-gradient(from 210deg at 10% 55%,rgba(255,36,60,.09) 0 4deg,transparent 5deg 15deg),
    repeating-conic-gradient(from 150deg at 90% 55%,rgba(28,126,255,.09) 0 4deg,transparent 5deg 15deg),
    radial-gradient(ellipse at 50% 105%,rgba(184,123,40,.15),transparent 42%) !important;
}

/* 更正式的布幕與舞台感 */
.curtain-left{
  width:24% !important;
  opacity:.82 !important;
  background:
    linear-gradient(90deg,rgba(105,5,24,.98),rgba(55,3,13,.84) 60%,transparent),
    repeating-linear-gradient(104deg,rgba(198,36,59,.14) 0 20px,rgba(0,0,0,.08) 21px 52px) !important;
}
.curtain-right{
  width:24% !important;
  opacity:.82 !important;
  background:
    linear-gradient(270deg,rgba(12,35,78,.98),rgba(10,18,36,.86) 60%,transparent),
    repeating-linear-gradient(76deg,rgba(61,118,215,.14) 0 20px,rgba(0,0,0,.08) 21px 52px) !important;
}

/* 頂部典禮標題更完整 */
.header{top:2.8% !important}
.kicker{
  color:#d7bc83 !important;
  font-size:clamp(10px,.76vw,14px) !important;
  letter-spacing:.42em !important;
}
.title{
  margin-top:.8vh !important;
  color:#f6e2b3 !important;
  font-size:clamp(42px,5vw,84px) !important;
  letter-spacing:.14em !important;
}
.header-rule{margin-top:1.4vh !important}
.header-sub{
  margin-top:.9vh !important;
  color:#b8a277 !important;
  font-size:clamp(9px,.7vw,13px) !important;
  letter-spacing:.28em !important;
}

/* THANK YOU 字樣保留並強化典禮收尾感 */
.thankyou{
  margin-top:.7vh;
  color:#d7bb7f;
  font-family:Arial,sans-serif;
  font-size:clamp(9px,.62vw,12px);
  font-weight:700;
  letter-spacing:.34em;
  white-space:nowrap;
  text-shadow:0 0 12px rgba(215,187,127,.15);
}

/* 主內容：金色主框，但左右隱約紅藍能量 */
.photo-panel{
  background:
    linear-gradient(145deg,#3f2310,#d7b362 12%,#8a571f 23%,#21150b 36%,#65461c 68%,#d7b362 87%,#43270e) !important;
  box-shadow:
    -14px 0 30px rgba(255,31,53,.08),
    14px 0 30px rgba(31,126,255,.08),
    0 22px 58px rgba(0,0,0,.60),
    0 0 34px rgba(216,180,106,.18) !important;
}
.photo-inner{
  background:
    radial-gradient(circle at 28% 50%,rgba(255,34,55,.07),transparent 30%),
    radial-gradient(circle at 72% 50%,rgba(30,133,255,.07),transparent 30%),
    radial-gradient(circle at 50% 45%,rgba(214,178,95,.09),transparent 36%),
    #050506 !important;
}

.award-label{
  color:#b59a60 !important;
  letter-spacing:.36em !important;
}
#awardTitle{
  color:#f6e6bd !important;
  text-shadow:
    -5px 0 18px rgba(255,38,57,.06),
    5px 0 18px rgba(36,135,255,.06),
    0 5px 24px rgba(0,0,0,.72) !important;
}
.gold-line{
  background:linear-gradient(90deg,#e0bf79 0%,#e0bf79 35%,rgba(224,191,121,.26) 68%,transparent) !important;
}
#awardNote{
  color:#dbc89a !important;
}

/* 底部舞台加一條紅藍金延伸 */
.floor{
  border-top:1px solid rgba(215,180,106,.42) !important;
  background:
    linear-gradient(90deg,rgba(158,10,29,.14),transparent 28%,rgba(223,183,99,.16) 50%,transparent 72%,rgba(24,95,194,.14)),
    radial-gradient(ellipse at 50% 0%,rgba(223,183,99,.26),transparent 58%),
    linear-gradient(180deg,rgba(142,101,39,.36),rgba(31,24,17,.2)) !important;
}

/* 左右小光點，讓整體仍像同一場紅藍賽事 */
.event-accent-left,
.event-accent-right{
  position:absolute;
  z-index:3;
  top:18%;bottom:10%;
  width:1px;
  pointer-events:none;
}
.event-accent-left{
  left:6.2%;
  background:linear-gradient(180deg,transparent,#ff314b 24%,#d6a755 66%,transparent);
  box-shadow:0 0 12px rgba(255,49,75,.28);
}
.event-accent-right{
  right:6.2%;
  background:linear-gradient(180deg,transparent,#2d8fff 24%,#d6a755 66%,transparent);
  box-shadow:0 0 12px rgba(45,143,255,.28);
}

</style>
</head>
<body>
<main class="stage empty-stage" id="stage">
  <div class="curtain-left"></div>
  <div class="curtain-right"></div>
  <div class="ceiling-lights"></div>
  <div class="event-accent-left"></div>
  <div class="event-accent-right"></div>

  <div class="brand"><strong>FINAL BATTLE 2026</strong>AWARD CEREMONY</div>

  <header class="header">
    <div class="kicker">FINAL BATTLE 2026</div>
    <h1 class="title">頒獎典禮</h1>
    <div class="header-rule"></div>
    <div class="header-sub">CELEBRATING EVERY BRAVE MOMENT</div>
    <div class="thankyou">THANK YOU FOR BEING AWESOME!</div>
  </header>

  <section class="main" id="awardMain">
    <div class="photo-panel">
      <div class="photo-inner">
        <div id="photoWrap"><div class="photo-placeholder">FINAL BATTLE</div></div>
      </div>
    </div>

    <div class="award-panel">
      <div class="award-label">SPECIAL RECOGNITION</div>
      <h2 id="awardTitle">神速陀螺手</h2>
      <div class="gold-line"></div>
      <div id="awardNote">超越極速的疾風</div>
      <div class="signature">FINAL BATTLE 2026 · HONOR THE MOMENT</div>
    </div>
  </section>

  <div class="floor"></div>
  <button class="back-battle" id="backBattle" type="button">返回比賽</button>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCPkvZj2_Z7ZgiG0itfP2YCjTvDkaSaPew",
  authDomain:"beyblade-x-event.firebaseapp.com",
  projectId:"beyblade-x-event",
  storageBucket:"beyblade-x-event.firebasestorage.app",
  messagingSenderId:"866394169939",
  appId:"1:866394169939:web:a73222040a99a433425ca6"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const stage=document.getElementById("stage");
const awardMain=document.getElementById("awardMain");
const photoWrap=document.getElementById("photoWrap");
const awardTitle=document.getElementById("awardTitle");
const awardNote=document.getElementById("awardNote");

let players=[];

function esc(v=""){
  return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function displayName(p){return p?.battleName||p?.name||"參賽者"}

function render(){
  const p=players.find(x=>x.awardProjected===true);
  if(!p){
    stage.classList.add("empty-stage");
    return;
  }
  stage.classList.remove("empty-stage");

  photoWrap.innerHTML=p.photoUrl
    ? `<img src="${esc(p.photoUrl)}" alt="${esc(displayName(p))}">`
    : `<div class="photo-placeholder">${esc(displayName(p).slice(0,1))}</div>`;

  awardTitle.textContent=p.awardTitle || "傳奇陀螺手";
  awardNote.textContent=p.awardNote || "站上巔峰的傳說";

  awardMain.classList.remove("reveal");
  void awardMain.offsetWidth;
  awardMain.classList.add("reveal");
}

onSnapshot(collection(db,"players"),snap=>{
  players=[];
  snap.forEach(d=>players.push({id:d.id,...d.data()}));
  console.log("[AWARDS] projected:", players.find(p=>p.awardProjected===true));
  render();
});

document.getElementById("backBattle")?.addEventListener("click",()=>{
  if(window.parent!==window){
    window.parent.postMessage({type:"projector:navigate",url:"battle.html"},"*");
  }else{
    window.location.href="battle.html";
  }
});
</script>
</body>
</html>
