<!DOCTYPE html>

<html lang="zh-Hant-TW"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台管理｜戰鬥陀螺爭霸戰</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;800&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --void:#080b14; --panel:#111a2e; --panel-alt:#0d1424; --line:#223055;
    --teal:#2ce0d9; --teal-glow:#8ff5ef; --purple:#b357f7; --purple-glow:#e79bff;
    --gold:#ffb627; --silver:#dfe7f2; --dim:#7d8aab; --warn:#ff5f6d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--void); color:var(--silver); font-family:'Noto Sans TC',sans-serif;}
  .wrap{max-width:1180px; margin:0 auto; padding:32px 20px 80px;}
  h1{
    font-family:'Orbitron',sans-serif; font-weight:800; letter-spacing:3px; font-size:22px;
    background:linear-gradient(100deg, var(--teal), var(--purple));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:6px;
  }
  .sub{color:var(--dim); font-size:13px; margin-bottom:24px;}
  .panel{
    background:linear-gradient(180deg, var(--panel), var(--panel-alt));
    border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:20px;
  }
  .login-box{max-width:340px; margin:80px auto;}
  input, select, textarea{
    width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--void); color:var(--silver); font-family:'Noto Sans TC'; font-size:14px;
  }
  input:focus, select:focus{outline:none; border-color:var(--teal);}
  label{display:block; font-size:12.5px; color:var(--dim); margin-bottom:6px;}
  .btn{
    padding:11px 18px; border-radius:10px; border:none; cursor:pointer;
    font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:1px; font-size:13px;
    background:linear-gradient(100deg, var(--teal), var(--purple)); color:#08101f;
  }
  .btn-outline{background:transparent; border:1px solid var(--teal); color:var(--teal-glow);}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:20px;}
  .stat-card{background:rgba(44,224,217,0.05); border:1px solid var(--line); border-radius:12px; padding:16px; text-align:center;}
  .stat-card .k{font-size:11px; color:var(--dim); letter-spacing:1px;}
  .stat-card .v{font-family:'Orbitron'; font-size:24px; font-weight:800; color:var(--teal-glow);}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th, td{padding:10px 8px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap;}
  th{color:var(--dim); font-size:11.5px; letter-spacing:1px; text-transform:uppercase;}
  tr:hover{background:rgba(44,224,217,0.04);}
  .table-scroll{overflow-x:auto;}
  select.status-select{padding:6px 8px; font-size:12.5px; width:auto;}
  .edit-select, .edit-input{padding:6px 8px; font-size:12.5px; width:auto;}
  /* 日期欄位：深色主題適配，讓文字與日曆圖示可見 */
  input[type=date]{
    color-scheme:dark;
    color:var(--silver);
    background:var(--void);
    cursor:pointer;
    min-width:150px;
  }
  input[type=date]::-webkit-calendar-picker-indicator{
    filter:invert(1) brightness(1.6);
    cursor:pointer;
    opacity:0.85;
  }
  input[type=date]::-webkit-calendar-picker-indicator:hover{opacity:1;}
  input[type=date]::-webkit-datetime-edit-text,
  input[type=date]::-webkit-datetime-edit-year-field,
  input[type=date]::-webkit-datetime-edit-month-field,
  input[type=date]::-webkit-datetime-edit-day-field{color:var(--silver);}
  input[type=date]:focus{outline:none; border-color:var(--teal);}
  .today-btn{
    padding:5px 8px; margin-left:4px; font-size:11px; border-radius:7px;
    background:transparent; border:1px solid var(--line); color:var(--dim); cursor:pointer;
  }
  .today-btn:hover{border-color:var(--teal); color:var(--teal-glow);}
  .status-unpaid{color:var(--warn); border-color:var(--warn) !important;}
  .status-pending{color:var(--gold); border-color:var(--gold) !important;}
  .status-confirmed{color:var(--teal-glow); border-color:var(--teal) !important;}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
  .toolbar input[type=text]{max-width:240px;}
  .sec-title{
    font-family:'Orbitron'; font-weight:800; font-size:12.5px; letter-spacing:2px;
    color:var(--purple-glow); margin-bottom:14px; text-transform:uppercase;
  }
  .notify-list{max-height:260px; overflow-y:auto; margin-top:12px;}
  .notify-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  .copy-btn{font-size:11.5px; padding:5px 10px; border-radius:8px;}
  .msg{font-size:13px; margin-top:8px;}
  .msg.ok{color:var(--teal-glow);} .msg.err{color:var(--warn);}
  .hidden{display:none !important;}
  textarea{min-height:90px; resize:vertical; font-family:'Noto Sans TC';}
  .checkbox-cell{text-align:center;}
</style>
</head>
<body>

<div class="wrap">

  <!-- ADMIN -->
  <div id="adminView">
    <h1>後台管理｜戰鬥陀螺爭霸戰</h1>
    <div class="sub">報名資料查詢 · 付款狀態管理 · 賽前通知</div>

    <div class="stats">
      <div class="stat-card"><div class="k">總報名數</div><div class="v" id="statTotal">9</div></div>
      <div class="stat-card"><div class="k">參賽選手</div><div class="v" id="statPlayers">9</div></div>
      <div class="stat-card"><div class="k">僅觀戰</div><div class="v" id="statSpectators">0</div></div>
      <div class="stat-card"><div class="k">需付費人數</div><div class="v" id="statPeople">27</div></div>
      <div class="stat-card"><div class="k">5歲以下（免計費）</div><div class="v" id="statUnder5">2</div></div>
      <div class="stat-card"><div class="k">已確認收款</div><div class="v" id="statConfirmed">0</div></div>
      <div class="stat-card"><div class="k">已收匯款總金額</div><div class="v" id="statTransferTotal">0</div></div>
      <div class="stat-card"><div class="k">待確認 / 未繳費</div><div class="v" id="statPending">9</div></div>
    </div>

    <div class="panel">
      <div class="sec-title">報名清單 REGISTRATIONS</div>
      <div class="toolbar">
        <input type="text" id="searchBox" placeholder="搜尋姓名 / 暱稱 / 電話 / 編號">
        <button class="btn-outline btn" id="refreshBtn">重新整理</button>
        <button class="btn-outline btn" id="exportBtn">匯出 CSV</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="checkbox-cell"><input type="checkbox" id="selectAll"></th>
              <th>報名編號</th><th>參賽者</th><th>暱稱</th><th>身份</th><th>陪同人數（需計費）</th><th>5歲以下（免計費）</th>
              <th>電話</th><th>Email</th><th>LINE ID</th><th>付款狀態</th><th>付款方式</th><th>匯款人數</th><th>匯款金額</th><th>付款日期</th><th>備註</th><th>報名時間</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"><tr><td colspan="16" style="text-align:center; color:var(--dim); padding:20px;">資料載入中…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="sec-title">賽前發送通知 NOTIFY</div>
      <div class="sub" style="margin-bottom:10px;">勾選上方名單後，系統會產生提醒訊息文字與聯絡清單，供您手動貼到 LINE / 簡訊發送（本系統不會自動發送訊息）。</div>
      <label>通知訊息內容</label>
      <textarea id="notifyTemplate">親愛的陀螺小戰士家長您好！
提醒您，8/22（六）14:30 於小樹屋共享空間，戰鬥陀螺爭霸戰即將登場 ⚡
請記得攜帶您的戰鬥陀螺與發射器，我們現場見！
主辦人 禹皓媽媽</textarea>
      <div style="height:10px;"></div>
      <button class="btn" id="genNotifyBtn">產生通知清單</button>
      <div class="notify-list" id="notifyList"></div>
    </div>

    <div class="panel">
      <div class="sec-title">家長留言 MESSAGES</div>
      <div id="messageList" style="display:flex; flex-direction:column; gap:12px;"><div class="sub">留言載入中…</div></div>
    </div>
  </div>

</div>

<script>
  // ====== TODO：請將下方 firebaseConfig 換成與 index.html 相同的設定值 ======
  const firebaseConfig = {
    apiKey: "AIzaSyCPkvZj2_Z7ZgiG0itfP2YCjTvDkaSaPew",
    authDomain: "beyblade-x-event.firebaseapp.com",
    projectId: "beyblade-x-event",
    storageBucket: "beyblade-x-event.firebasestorage.app",
    messagingSenderId: "866394169939",
    appId: "1:866394169939:web:a73222040a99a433425ca6"
  };
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOM8WZqq9N6Vad_5q6HHCgZrZcNwU6USbb2QfHTeH87Z_095qwxx9tGXmYUGyAK8-Cig/exec";

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const COL = "registrations";
  let allRecords = [];

  loadData();

  function pushToSheet(action, data){
    fetch(APPS_SCRIPT_URL, {
      method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain"},
      body: JSON.stringify({action, data})
    }).catch(()=>{});
  }

  async function loadData(){
    const body = document.getElementById('tableBody');
    try{
      if(typeof firebase === "undefined"){
        body.innerHTML = '<tr><td colspan="16" style="text-align:center; color:var(--warn); padding:20px;">Firebase 程式庫載入失敗，請確認網路連線後重新整理頁面。</td></tr>';
        return;
      }
      const snap = await db.collection(COL).orderBy("createdAt","desc").get();
      allRecords = [];
      snap.forEach(doc=> allRecords.push({id: doc.id, ...doc.data()}));
      renderTable(allRecords);
      renderStats(allRecords);
      loadMessages();
    }catch(err){
      body.innerHTML = `<tr><td colspan="16" style="text-align:center; color:var(--warn); padding:20px;">資料載入失敗：${err.message}</td></tr>`;
      console.error(err);
    }
  }

  async function loadMessages(){
    const listEl = document.getElementById('messageList');
    try{
      const snap = await db.collection("messages").orderBy("createdAt","desc").get();
      if(snap.empty){
        listEl.innerHTML = '<div class="sub">目前還沒有家長留言</div>';
        return;
      }
      listEl.innerHTML = "";
      snap.forEach(doc=>{
        const d = doc.data();
        const created = d.createdAt && d.createdAt.toDate ? d.createdAt.toDate().toLocaleString('zh-TW') : "-";
        const item = document.createElement('div');
        item.style.cssText = "border:1px solid var(--line); border-radius:10px; padding:12px;";
        item.innerHTML = `
          <div style="display:flex; justify-content:space-between; font-size:12.5px; color:var(--dim); margin-bottom:6px;">
            <span style="color:var(--teal-glow); font-weight:700;">${d.name || "匿名家長"}</span>
            <span>${created}</span>
          </div>
          <div style="font-size:14px; color:var(--silver); white-space:pre-wrap;">${d.message || ""}</div>
        `;
        listEl.appendChild(item);
      });
    }catch(err){
      listEl.innerHTML = '<div class="sub">留言載入失敗</div>';
      console.error(err);
    }
  }

  function renderStats(records){
    document.getElementById('statTotal').textContent = records.length;
    document.getElementById('statPlayers').textContent = records.filter(r=>(r.role||"參賽選手")==="參賽選手").length;
    document.getElementById('statSpectators').textContent = records.filter(r=>r.role==="僅觀戰").length;
    const people = records.reduce((sum,r)=> sum + 1 + Number(r.parents||0), 0);
    document.getElementById('statPeople').textContent = people;
    const under5 = records.reduce((sum,r)=> sum + Number(r.under5||0), 0);
    document.getElementById('statUnder5').textContent = under5;
    document.getElementById('statConfirmed').textContent = records.filter(r=>r.paymentStatus==="已確認收款").length;
    const transferTotal = records.filter(r=>r.paymentStatus==="已確認收款").reduce((sum,r)=> sum + Number(r.transferAmount||0), 0);
    document.getElementById('statTransferTotal').textContent = transferTotal.toLocaleString('zh-TW');
    document.getElementById('statPending').textContent = records.filter(r=>r.paymentStatus!=="已確認收款").length;
  }

  function statusClass(status){
    if(status === "已確認收款") return "status-confirmed";
    if(status === "已回報待確認") return "status-pending";
    return "status-unpaid";
  }

  function renderTable(records){
    const body = document.getElementById('tableBody');
    body.innerHTML = "";
    records.forEach(r=>{
      const tr = document.createElement('tr');
      const created = r.createdAt && r.createdAt.toDate ? r.createdAt.toDate().toLocaleString('zh-TW') : "-";
      tr.innerHTML = `
        <td class="checkbox-cell"><input type="checkbox" class="rowCheck" data-id="${r.id}"></td>
        <td>${r.id}</td>
        <td>${r.name||""}</td>
        <td>${r.nickname||""}</td>
        <td>${r.role==="僅觀戰" ? "👀 僅觀戰" : "🏆 參賽選手"}</td>
        <td>${r.parents||0}</td>
        <td>${r.under5||0}</td>
        <td>${r.phone||""}</td>
        <td>${r.email||""}</td>
        <td>${r.lineId||""}</td>
        <td>
          <select class="status-select ${statusClass(r.paymentStatus)}" data-id="${r.id}">
            <option value="未繳費" ${r.paymentStatus==="未繳費"?"selected":""}>未繳費</option>
            <option value="已回報待確認" ${r.paymentStatus==="已回報待確認"?"selected":""}>已回報待確認</option>
            <option value="已確認收款" ${r.paymentStatus==="已確認收款"?"selected":""}>已確認收款</option>
          </select>
        </td>
        <td>
          <select class="edit-select payment-method-select" data-id="${r.id}" data-field="paymentMethod">
            <option value="" ${!r.paymentMethod?"selected":""}>—</option>
            <option value="LINE" ${r.paymentMethod==="LINE"?"selected":""}>LINE</option>
            <option value="匯款" ${r.paymentMethod==="匯款"?"selected":""}>匯款</option>
          </select>
        </td>
        <td><input type="number" class="edit-input transfer-count-input" data-id="${r.id}" data-field="transferCount" value="${r.transferCount!=null?r.transferCount:""}" min="0" style="width:64px;"></td>
        <td><input type="number" class="edit-input transfer-amount-input" data-id="${r.id}" data-field="transferAmount" value="${r.transferAmount!=null?r.transferAmount:""}" min="0" style="width:90px;"></td>
        <td style="white-space:nowrap;">
          <input type="date" class="edit-input payment-date-input" data-id="${r.id}" data-field="paymentDate" value="${r.paymentDate||""}">
          <button class="today-btn" data-id="${r.id}" title="填入今天日期">今天</button>
        </td>
        <td><input type="text" class="edit-input payment-note-input" data-id="${r.id}" data-field="paymentNote" value="${(r.paymentNote||"").replace(/"/g,"&quot;")}" style="width:130px;"></td>
        <td>${created}</td>
        <td><button class="btn-outline btn del-btn" data-id="${r.id}" data-name="${r.name||""}" style="padding:6px 10px; font-size:11.5px; color:var(--warn); border-color:var(--warn);">刪除</button></td>
      `;
      body.appendChild(tr);
    });

    document.querySelectorAll('.status-select').forEach(sel=>{
      sel.addEventListener('change', async (e)=>{
        const id = e.target.dataset.id;
        const newStatus = e.target.value;
        e.target.className = "status-select " + statusClass(newStatus);
        await db.collection(COL).doc(id).update({paymentStatus: newStatus});
        pushToSheet("updateStatus", {regId: id, paymentStatus: newStatus});
        const rec = allRecords.find(r=>r.id===id);
        if(rec) rec.paymentStatus = newStatus;
        renderStats(allRecords);
      });
    });

    document.querySelectorAll('.payment-method-select').forEach(sel=>{
      sel.addEventListener('change', async (e)=>{
        const id = e.target.dataset.id;
        const val = e.target.value;
        try{
          await db.collection(COL).doc(id).update({paymentMethod: val});
          pushToSheet("updateField", {regId:id, field:"paymentMethod", value: val});
          const rec = allRecords.find(r=>r.id===id);
          if(rec) rec.paymentMethod = val;
        }catch(err){ alert("儲存失敗，請稍後再試"); console.error(err); }
      });
    });

    document.querySelectorAll('.transfer-count-input, .transfer-amount-input').forEach(inp=>{
      inp.addEventListener('change', async (e)=>{
        const id = e.target.dataset.id;
        const field = e.target.dataset.field;
        const val = e.target.value === "" ? null : Number(e.target.value);
        try{
          await db.collection(COL).doc(id).update({[field]: val});
          pushToSheet("updateField", {regId:id, field, value: val});
          const rec = allRecords.find(r=>r.id===id);
          if(rec) rec[field] = val;
        }catch(err){ alert("儲存失敗，請稍後再試"); console.error(err); }
      });
    });

    document.querySelectorAll('.payment-date-input').forEach(inp=>{
      // 點擊欄位任一處即開啟日曆（不必精準點到小圖示）
      inp.addEventListener('click', ()=>{
        if(typeof inp.showPicker === "function"){
          try{ inp.showPicker(); }catch(e){}
        }
      });
      inp.addEventListener('change', async (e)=>{
        const id = e.target.dataset.id;
        const val = e.target.value;
        try{
          await db.collection(COL).doc(id).update({paymentDate: val});
          pushToSheet("updateField", {regId:id, field:"paymentDate", value: val});
          const rec = allRecords.find(r=>r.id===id);
          if(rec) rec.paymentDate = val;
        }catch(err){ alert("儲存失敗，請稍後再試"); console.error(err); }
      });
    });

    document.querySelectorAll('.today-btn').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        const id = e.target.dataset.id;
        const d = new Date();
        const today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        const inp = document.querySelector(`.payment-date-input[data-id="${id}"]`);
        if(inp) inp.value = today;
        try{
          await db.collection(COL).doc(id).update({paymentDate: today});
          pushToSheet("updateField", {regId:id, field:"paymentDate", value: today});
          const rec = allRecords.find(r=>r.id===id);
          if(rec) rec.paymentDate = today;
        }catch(err){ alert("儲存失敗，請稍後再試"); console.error(err); }
      });
    });

    document.querySelectorAll('.payment-note-input').forEach(inp=>{
      inp.addEventListener('change', async (e)=>{
        const id = e.target.dataset.id;
        const val = e.target.value;
        try{
          await db.collection(COL).doc(id).update({paymentNote: val});
          pushToSheet("updateField", {regId:id, field:"paymentNote", value: val});
          const rec = allRecords.find(r=>r.id===id);
          if(rec) rec.paymentNote = val;
        }catch(err){ alert("儲存失敗，請稍後再試"); console.error(err); }
      });
    });

    document.querySelectorAll('.del-btn').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        const id = e.target.dataset.id;
        const name = e.target.dataset.name;
        if(!confirm(`確定要刪除「${name}」（${id}）這筆報名資料嗎？此動作無法復原。`)) return;
        try{
          await db.collection(COL).doc(id).delete();
          allRecords = allRecords.filter(r=>r.id!==id);
          renderTable(allRecords);
          renderStats(allRecords);
        }catch(err){
          alert("刪除失敗，請稍後再試");
          console.error(err);
        }
      });
    });
  }

  document.getElementById('searchBox').addEventListener('input', (e)=>{
    const q = e.target.value.trim().toLowerCase();
    const filtered = allRecords.filter(r=>
      (r.name||"").toLowerCase().includes(q) ||
      (r.nickname||"").toLowerCase().includes(q) ||
      (r.phone||"").includes(q) ||
      (r.id||"").toLowerCase().includes(q)
    );
    renderTable(filtered);
  });

  document.getElementById('refreshBtn').addEventListener('click', loadData);

  document.getElementById('selectAll').addEventListener('change', (e)=>{
    document.querySelectorAll('.rowCheck').forEach(cb=> cb.checked = e.target.checked);
  });

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const rows = [["報名編號","參賽者","暱稱","身份","陪同人數（需計費）","5歲以下（免計費）","電話","Email","LINE ID","付款狀態","付款方式","匯款人數","匯款金額","付款日期","備註"]];
    allRecords.forEach(r=> rows.push([r.id, r.name, r.nickname, r.role||"參賽選手", r.parents, r.under5||0, r.phone, r.email, r.lineId, r.paymentStatus, r.paymentMethod||"", r.transferCount!=null?r.transferCount:"", r.transferAmount!=null?r.transferAmount:"", r.paymentDate||"", r.paymentNote||""]));
    const csv = rows.map(row=> row.map(c=> `"${String(c||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = "戰鬥陀螺爭霸戰_報名清單.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
  });

  document.getElementById('genNotifyBtn').addEventListener('click', ()=>{
    const checked = Array.from(document.querySelectorAll('.rowCheck:checked')).map(cb=>cb.dataset.id);
    const targets = checked.length > 0 ? allRecords.filter(r=> checked.includes(r.id)) : allRecords;
    const template = document.getElementById('notifyTemplate').value;
    const list = document.getElementById('notifyList');
    list.innerHTML = "";
    targets.forEach(r=>{
      const item = document.createElement('div');
      item.className = "notify-item";
      item.innerHTML = `
        <span>${r.nickname || r.name}（LINE：${r.lineId || "-"} / 電話：${r.phone || "-"}）</span>
        <button class="btn-outline btn copy-btn" data-msg="${encodeURIComponent(template)}">複製訊息</button>
      `;
      list.appendChild(item);
    });
    document.querySelectorAll('.copy-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        const msg = decodeURIComponent(e.target.dataset.msg);
        navigator.clipboard.writeText(msg);
        e.target.textContent = "已複製 ✓";
        setTimeout(()=> e.target.textContent = "複製訊息", 1500);
      });
    });
  });
</script>


</body></html>
