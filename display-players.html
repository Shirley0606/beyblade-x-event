<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>選手登場｜FINAL BATTLE 2026</title>
<meta name="theme-color" content="#02040a">
<style>
:root{--red:#ff263d;--blue:#168cff}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  font-family:"PingFang TC","Microsoft JhengHei",Arial,sans-serif
}
body{display:flex;align-items:center;justify-content:center}
.stage{
  position:relative;
  width:min(100vw,177.7777778vh);
  height:min(100vh,56.25vw);
  aspect-ratio:16/9;
  overflow:hidden;
  background:#02040a;
}
.stage::before,.stage::after{
  content:"";position:absolute;width:105%;height:190%;top:-45%;
  border-radius:50%;z-index:0;pointer-events:none
}
.stage::before{
  left:-56%;
  background:
    repeating-conic-gradient(from 0deg,transparent 0deg 7deg,rgba(255,35,55,.24) 8deg 12deg,transparent 13deg 24deg),
    radial-gradient(circle at center,rgba(255,32,50,.28) 0 11%,transparent 12% 27%,rgba(255,32,50,.13) 28% 29%,transparent 30%);
  filter:drop-shadow(0 0 22px rgba(255,30,48,.48));
  animation:redSpin 18s linear infinite
}
.stage::after{
  right:-56%;
  background:
    repeating-conic-gradient(from 0deg,transparent 0deg 7deg,rgba(22,140,255,.24) 8deg 12deg,transparent 13deg 24deg),
    radial-gradient(circle at center,rgba(22,140,255,.28) 0 11%,transparent 12% 27%,rgba(22,140,255,.13) 28% 29%,transparent 30%);
  filter:drop-shadow(0 0 22px rgba(22,140,255,.48));
  animation:blueSpin 21s linear infinite
}
@keyframes redSpin{to{transform:rotate(360deg)}}
@keyframes blueSpin{to{transform:rotate(-360deg)}}
.hero{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:83%;
  z-index:2;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:.7% 1.2% 0;
}
.hero img{
  width:100%;height:100%;object-fit:contain;object-position:center;display:block;
  filter:drop-shadow(0 18px 35px rgba(0,0,0,.7));
  animation:cardIn .55s cubic-bezier(.2,.8,.2,1)
}
.placeholder{
  width:100%;height:100%;display:grid;place-items:center;color:#7c8799;font-size:3vw;
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(115deg,rgba(85,10,22,.45),rgba(3,7,14,.92) 48%,rgba(7,41,92,.45))
}
@keyframes cardIn{from{opacity:0;transform:scale(1.018)}to{opacity:1;transform:scale(1)}}
.enter-btn{
  position:absolute;right:2.2%;bottom:2.4%;z-index:12;
  display:flex;align-items:center;justify-content:center;
  min-width:14.5%;height:7.2%;padding:0 2.4%;
  color:#fff;text-decoration:none;
  font-size:clamp(14px,1.35vw,26px);font-weight:900;letter-spacing:.14em;font-style:italic;
  border:1px solid rgba(255,255,255,.45);
  background:linear-gradient(180deg,#d11928,#8e0713 58%,#59050c);
  box-shadow:inset 0 0 0 3px rgba(20,0,5,.75),0 0 22px rgba(255,24,43,.38);
  clip-path:polygon(7% 0,93% 0,100% 22%,100% 78%,93% 100%,7% 100%,0 78%,0 22%);
  opacity:.9;transition:.18s
}
.enter-btn:hover{opacity:1;transform:translateY(-2px);filter:brightness(1.12)}
.stage.hide-ui .enter-btn{opacity:0;pointer-events:none}
@media (max-aspect-ratio:16/9){
  .stage{width:100vw;height:56.25vw}
}
@media (min-aspect-ratio:16/9){
  .stage{width:177.7777778vh;height:100vh}
}

.roster{
  position:absolute;
  left:2%;
  right:19%;
  bottom:2.1%;
  z-index:10;
  display:flex;
  gap:.7%;
  overflow-x:auto;
  padding:.35% .2%;
  scrollbar-width:none;
  scroll-behavior:smooth;
}
.roster::-webkit-scrollbar{display:none}
.thumb{
  flex:0 0 11.5%;
  aspect-ratio:16/9;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.28);
  background:#080d15;
  clip-path:polygon(4% 0,96% 0,100% 8%,100% 92%,96% 100%,4% 100%,0 92%,0 8%);
  opacity:.72;
  transition:.18s;
}
.thumb:hover{opacity:1;transform:translateY(-2px)}
.thumb.active{
  opacity:1;
  border-color:#fff;
  box-shadow:0 0 14px rgba(255,255,255,.28),0 0 18px rgba(22,140,255,.22);
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}
.thumb .ph{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  color:#7b8798;
  font-size:.7vw;
  background:linear-gradient(115deg,rgba(90,9,20,.55),rgba(6,11,18,.9),rgba(9,45,98,.55));
}


/* ===== 版面微調：主圖上移、縮圖與主圖完全分離 ===== */
.hero{
  position:absolute !important;
  left:0 !important;
  right:0 !important;
  top:0 !important;
  bottom:auto !important;
  height:83% !important;
  padding:.55% 1.2% 0 !important;
  align-items:flex-start !important;
}
.hero img{
  width:100% !important;
  height:100% !important;
  object-fit:contain !important;
  object-position:center top !important;
}

/* 下方縮圖獨立成一條選手列 */
.roster{
  position:absolute !important;
  left:1.5% !important;
  right:18.5% !important;
  bottom:1.4% !important;
  height:13.3% !important;
  z-index:10 !important;
  display:flex !important;
  align-items:center !important;
  gap:.65% !important;
  padding:.25% .2% !important;
  overflow-x:auto !important;
  background:linear-gradient(180deg,rgba(1,4,9,.08),rgba(1,4,9,.80));
  border-top:1px solid rgba(255,255,255,.08);
}
.thumb{
  flex:0 0 12.3% !important;
  height:88% !important;
  aspect-ratio:16/9 !important;
}

/* 進入比賽與縮圖同列，但不互相遮擋 */
.enter-btn{
  right:1.6% !important;
  bottom:2.6% !important;
  min-width:15.5% !important;
  height:8.5% !important;
}

/* 新標示：改為「戰鬥陀螺手」 */
.player-type-label{
  position:absolute;
  z-index:13;
  top:3.1%;
  right:3.2%;
  padding:.48% 1.35%;
  color:#fff;
  font-size:clamp(13px,1.05vw,21px);
  font-weight:800;
  letter-spacing:.12em;
  background:linear-gradient(90deg,rgba(7,10,16,.92),rgba(8,20,40,.84));
  border:1px solid rgba(255,255,255,.30);
  border-left:3px solid #168cff;
  transform:skew(-8deg);
  box-shadow:0 0 14px rgba(22,140,255,.18);
}
.player-type-label span{display:block;transform:skew(8deg)}

</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="player-type-label"><span>戰鬥陀螺手</span></div>
  <div class="hero" id="hero">
    <div class="placeholder">等待選手資料</div>
  </div>

  <div class="roster" id="roster"></div>
  <a class="enter-btn" href="battle.html">進入比賽</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCPkvZj2_Z7ZgiG0itfP2YCjTvDkaSaPew",
  authDomain:"beyblade-x-event.firebaseapp.com",
  projectId:"beyblade-x-event",
  storageBucket:"beyblade-x-event.firebasestorage.app",
  messagingSenderId:"866394169939",
  appId:"1:866394169939:web:a73222040a99a433425ca6"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const stage=document.getElementById("stage");
const hero=document.getElementById("hero");
const roster=document.getElementById("roster");

let players=[];
let currentIndex=0;
let timer=null;
const AUTO_MS=10000;

function esc(v=""){
  return String(v).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}
function nameOf(p){return p?.battleName||p?.name||"參賽者"}

function renderRoster(){
  roster.innerHTML="";
  players.forEach((p,i)=>{
    const el=document.createElement("div");
    el.className="thumb";
    el.dataset.index=i;
    el.innerHTML=p.photoUrl
      ? `<img src="${esc(p.photoUrl)}" alt="${esc(nameOf(p))}">`
      : `<div class="ph">${esc(nameOf(p))}</div>`;
    el.addEventListener("click",()=>{
      show(i);
      startAuto();
    });
    roster.appendChild(el);
  });
}
function show(index){
  if(!players.length){
    hero.innerHTML='<div class="placeholder">等待選手資料</div>';
    return;
  }
  currentIndex=(index+players.length)%players.length;
  const p=players[currentIndex];
  hero.innerHTML=p.photoUrl
    ? `<img src="${esc(p.photoUrl)}" alt="${esc(nameOf(p))}">`
    : `<div class="placeholder">${esc(nameOf(p))}</div>`;

  document.querySelectorAll(".thumb").forEach((el,i)=>{
    el.classList.toggle("active", i===currentIndex);
  });
  document.querySelector(`.thumb[data-index="${currentIndex}"]`)?.scrollIntoView({
    behavior:"smooth",block:"nearest",inline:"center"
  });
}
function next(){
  if(players.length>1) show(currentIndex+1);
}
function startAuto(){
  clearInterval(timer);
  if(players.length){
      timer=setInterval(next,AUTO_MS);
  }
}

const q=query(collection(db,"players"),orderBy("createdAt","asc"));
onSnapshot(q,snapshot=>{
  const oldId=players[currentIndex]?.id;
  players=[];
  snapshot.forEach(d=>players.push({id:d.id,...d.data()}));
  renderRoster();
  if(!players.length){
    clearInterval(timer);
    show(0);
    return;
  }
  const sameIndex=oldId ? players.findIndex(p=>p.id===oldId) : -1;
  currentIndex=sameIndex>=0 ? sameIndex : 0;
  show(currentIndex);
  startAuto();
},err=>{
  console.error(err);
  hero.innerHTML='<div class="placeholder">無法讀取選手資料</div>';
});

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){show(currentIndex+1);startAuto()}
  if(e.key==="ArrowLeft"){show(currentIndex-1);startAuto()}
  if(e.key.toLowerCase()==="h") stage.classList.toggle("hide-ui");
  if(e.key.toLowerCase()==="f"){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
});
stage.addEventListener("dblclick",e=>{
  if(e.target.closest(".enter-btn")) return;
  stage.classList.toggle("hide-ui");
});
</script>
</body>
</html>
