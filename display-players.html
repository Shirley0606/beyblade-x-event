<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>選手登場｜FINAL BATTLE 2026</title>
<meta name="theme-color" content="#02040a">
<style>
:root{--red:#ff263d;--blue:#168cff}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;
  font-family:"PingFang TC","Microsoft JhengHei",Arial,sans-serif
}
body{display:flex;align-items:center;justify-content:center}
.stage{
  position:relative;
  width:min(100vw,177.7777778vh);
  height:min(100vh,56.25vw);
  aspect-ratio:16/9;
  overflow:hidden;
  background:#02040a;
}
.stage::before,.stage::after{
  content:"";position:absolute;width:105%;height:190%;top:-45%;
  border-radius:50%;z-index:0;pointer-events:none
}
.stage::before{
  left:-56%;
  background:
    repeating-conic-gradient(from 0deg,transparent 0deg 7deg,rgba(255,35,55,.24) 8deg 12deg,transparent 13deg 24deg),
    radial-gradient(circle at center,rgba(255,32,50,.28) 0 11%,transparent 12% 27%,rgba(255,32,50,.13) 28% 29%,transparent 30%);
  filter:drop-shadow(0 0 22px rgba(255,30,48,.48));
  animation:redSpin 18s linear infinite
}
.stage::after{
  right:-56%;
  background:
    repeating-conic-gradient(from 0deg,transparent 0deg 7deg,rgba(22,140,255,.24) 8deg 12deg,transparent 13deg 24deg),
    radial-gradient(circle at center,rgba(22,140,255,.28) 0 11%,transparent 12% 27%,rgba(22,140,255,.13) 28% 29%,transparent 30%);
  filter:drop-shadow(0 0 22px rgba(22,140,255,.48));
  animation:blueSpin 21s linear infinite
}
@keyframes redSpin{to{transform:rotate(360deg)}}
@keyframes blueSpin{to{transform:rotate(-360deg)}}
.hero{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:83%;
  z-index:2;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:.7% 1.2% 0;
}
.hero img{
  width:100%;height:100%;object-fit:contain;object-position:center;display:block;
  filter:drop-shadow(0 18px 35px rgba(0,0,0,.7));
  animation:cardIn .55s cubic-bezier(.2,.8,.2,1)
}
.placeholder{
  width:100%;height:100%;display:grid;place-items:center;color:#7c8799;font-size:3vw;
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(115deg,rgba(85,10,22,.45),rgba(3,7,14,.92) 48%,rgba(7,41,92,.45))
}
@keyframes cardIn{from{opacity:0;transform:scale(1.018)}to{opacity:1;transform:scale(1)}}
.enter-btn{
  position:absolute;right:2.2%;bottom:2.4%;z-index:12;
  display:flex;align-items:center;justify-content:center;
  min-width:14.5%;height:7.2%;padding:0 2.4%;
  color:#fff;text-decoration:none;
  font-size:clamp(14px,1.35vw,26px);font-weight:900;letter-spacing:.14em;font-style:italic;
  border:1px solid rgba(255,255,255,.45);
  background:linear-gradient(180deg,#d11928,#8e0713 58%,#59050c);
  box-shadow:inset 0 0 0 3px rgba(20,0,5,.75),0 0 22px rgba(255,24,43,.38);
  clip-path:polygon(7% 0,93% 0,100% 22%,100% 78%,93% 100%,7% 100%,0 78%,0 22%);
  opacity:.9;transition:.18s
}
.enter-btn:hover{opacity:1;transform:translateY(-2px);filter:brightness(1.12)}
.stage.hide-ui .enter-btn{opacity:0;pointer-events:none}
@media (max-aspect-ratio:16/9){
  .stage{width:100vw;height:56.25vw}
}
@media (min-aspect-ratio:16/9){
  .stage{width:177.7777778vh;height:100vh}
}

.roster{
  position:absolute;
  left:2%;
  right:19%;
  bottom:2.1%;
  z-index:10;
  display:flex;
  gap:.7%;
  overflow-x:auto;
  padding:.35% .2%;
  scrollbar-width:none;
  scroll-behavior:smooth;
}
.roster::-webkit-scrollbar{display:none}
.thumb{
  flex:0 0 11.5%;
  aspect-ratio:16/9;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.28);
  background:#080d15;
  clip-path:polygon(4% 0,96% 0,100% 8%,100% 92%,96% 100%,4% 100%,0 92%,0 8%);
  opacity:.72;
  transition:.18s;
}
.thumb:hover{opacity:1;transform:translateY(-2px)}
.thumb.active{
  opacity:1;
  border-color:#fff;
  box-shadow:0 0 14px rgba(255,255,255,.28),0 0 18px rgba(22,140,255,.22);
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}
.thumb .ph{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  color:#7b8798;
  font-size:.7vw;
  background:linear-gradient(115deg,rgba(90,9,20,.55),rgba(6,11,18,.9),rgba(9,45,98,.55));
}


/* ===== 版面微調：主圖上移、縮圖與主圖完全分離 ===== */
.hero{
  position:absolute !important;
  left:0 !important;
  right:0 !important;
  top:0 !important;
  bottom:auto !important;
  height:83% !important;
  padding:.55% 1.2% 0 !important;
  align-items:flex-start !important;
}
.hero img{
  width:100% !important;
  height:100% !important;
  object-fit:contain !important;
  object-position:center top !important;
}

/* 下方縮圖獨立成一條選手列 */
.roster{
  position:absolute !important;
  left:1.5% !important;
  right:18.5% !important;
  bottom:1.4% !important;
  height:13.3% !important;
  z-index:10 !important;
  display:flex !important;
  align-items:center !important;
  gap:.65% !important;
  padding:.25% .2% !important;
  overflow-x:auto !important;
  background:linear-gradient(180deg,rgba(1,4,9,.08),rgba(1,4,9,.80));
  border-top:1px solid rgba(255,255,255,.08);
}
.thumb{
  flex:0 0 12.3% !important;
  height:88% !important;
  aspect-ratio:16/9 !important;
}

/* 進入比賽與縮圖同列，但不互相遮擋 */
.enter-btn{
  right:1.6% !important;
  bottom:2.6% !important;
  min-width:15.5% !important;
  height:8.5% !important;
}


.fullscreen-start{
  position:absolute;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.72);backdrop-filter:blur(8px);transition:.25s
}
.fullscreen-start.hidden{opacity:0;visibility:hidden;pointer-events:none}
.fullscreen-box{
  min-width:340px;padding:26px 34px;text-align:center;border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(135deg,rgba(55,5,13,.95),rgba(5,10,18,.96) 52%,rgba(5,31,70,.95));
  box-shadow:0 0 34px rgba(0,0,0,.7),0 0 28px rgba(255,33,53,.18);
  clip-path:polygon(5% 0,95% 0,100% 15%,100% 85%,95% 100%,5% 100%,0 85%,0 15%)
}
.fullscreen-box strong{display:block;font-size:26px;letter-spacing:.12em;color:#fff;margin-bottom:8px}
.fullscreen-box small{display:block;font-size:13px;color:#b8c4d6;margin-bottom:18px}
.fullscreen-go{
  border:0;min-width:220px;padding:14px 24px;color:#fff;font-size:18px;font-weight:900;
  letter-spacing:.12em;cursor:pointer;background:linear-gradient(180deg,#d51b2c,#8d0714);
  box-shadow:0 0 20px rgba(255,34,53,.32);
  clip-path:polygon(7% 0,93% 0,100% 20%,100% 80%,93% 100%,7% 100%,0 80%,0 20%)
}
.fullscreen-go:hover{filter:brightness(1.13)}


/* ===== 修正最後幾位選手主圖偏移 ===== */
html, body {
  overflow-x: hidden !important;
}
.stage {
  margin-left: auto !important;
  margin-right: auto !important;
  transform: none !important;
}
.hero img,
.placeholder {
  margin-left: auto !important;
  margin-right: auto !important;
}
.roster {
  overscroll-behavior-x: contain !important;
}


/* ===== V5 根治：選手列固定、不水平捲動 ===== */
.roster{
  overflow-x:hidden !important;
  overflow-y:hidden !important;
  scroll-behavior:auto !important;
  justify-content:flex-start !important;
  gap:.45% !important;
}
.thumb{
  flex:1 1 0 !important;
  min-width:0 !important;
  max-width:11.2% !important;
  height:88% !important;
}


/* ===== 修正右下角「進入比賽」可點擊 ===== */
.enter-btn{
  z-index:999 !important;
  pointer-events:auto !important;
}


/* ===== 統一投影殼：DISPLAY → BATTLE → AWARDS 全程維持同一 fullscreen session ===== */
.enter-btn{font-family:inherit}
.projector-shell{
  position:fixed; inset:0; z-index:5000;
  width:100vw; height:100vh; background:#000;
  display:none; overflow:hidden;
}
.projector-shell.active{display:block}
.projector-frame{
  width:100%; height:100%; border:0; display:block; background:#000;
}
.projector-home{
  position:absolute; left:1.3%; bottom:1.6%; z-index:5002;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(5,9,15,.72); color:#d7e0ed;
  padding:.55em .85em; border-radius:7px;
  font:700 clamp(9px,.65vw,12px)/1 system-ui;
  cursor:pointer; backdrop-filter:blur(8px);
  opacity:.55;
}
.projector-home:hover{opacity:1}


/* ===== DISPLAY：右下角新增頒獎典禮入口 ===== */
.projector-entry-actions{
  position:absolute;
  right:2.2%;
  bottom:2.3%;
  z-index:120;
  display:flex;
  align-items:center;
  gap:10px;
}
.projector-entry-actions .enter-btn{
  position:static !important;
  right:auto !important;
  bottom:auto !important;
}
.award-entry-btn{
  border:1px solid rgba(255,214,104,.58);
  background:linear-gradient(180deg,rgba(86,56,5,.92),rgba(34,22,4,.96));
  color:#ffe7a1;
  padding:.72em 1.25em;
  border-radius:8px;
  font-size:clamp(10px,.75vw,14px);
  font-weight:900;
  letter-spacing:.08em;
  cursor:pointer;
  box-shadow:0 0 18px rgba(255,198,58,.12);
  backdrop-filter:blur(8px);
}
.award-entry-btn:hover{
  filter:brightness(1.12);
}

</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="fullscreen-start" id="fullscreenStart">
    <div class="fullscreen-box">
      <strong>FINAL BATTLE 2026</strong>
      <small>點一下即可進入投影全螢幕模式</small>
      <button class="fullscreen-go" id="fullscreenGo">進入全螢幕</button>
    </div>
  </div>
  <div class="hero" id="hero">
    <div class="placeholder">等待選手資料</div>
  </div>

  <div class="roster" id="roster"></div>
  <div class="projector-entry-actions">
  <button class="award-entry-btn" id="enterAwardsBtn" type="button">頒獎典禮</button>
  <button class="enter-btn" id="enterBattleBtn" type="button">進入比賽</button>
</div>
</div>

<div class="projector-shell" id="projectorShell">
  <iframe class="projector-frame" id="projectorFrame" title="比賽投影畫面" allow="fullscreen"></iframe>
  <button class="projector-home" id="projectorHome" type="button">返回選手登場</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCPkvZj2_Z7ZgiG0itfP2YCjTvDkaSaPew",
  authDomain: "beyblade-x-event.firebaseapp.com",
  projectId: "beyblade-x-event",
  storageBucket: "beyblade-x-event.firebasestorage.app",
  messagingSenderId: "866394169939",
  appId: "1:866394169939:web:a73222040a99a433425ca6"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const stage=document.getElementById("stage");
const hero=document.getElementById("hero");
const roster=document.getElementById("roster");

let players=[];
let currentIndex=0;
let timer=null;
const AUTO_MS=10000;

function esc(v=""){
  return String(v).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}
function nameOf(p){return p?.battleName||p?.name||"參賽者"}

function renderRoster(){
  roster.innerHTML="";
  players.forEach((p,i)=>{
    const el=document.createElement("div");
    el.className="thumb";
    el.dataset.index=i;
    el.innerHTML=p.photoUrl
      ? `<img src="${esc(p.photoUrl)}" alt="${esc(nameOf(p))}">`
      : `<div class="ph">${esc(nameOf(p))}</div>`;
    el.addEventListener("click",()=>{
      show(i);
      startAuto();
    });
    roster.appendChild(el);
  });
}
function show(index){
  if(!players.length){
    hero.innerHTML='<div class="placeholder">目前尚無選手資料</div>';
    return;
  }
  currentIndex=(index+players.length)%players.length;
  const p=players[currentIndex];
  hero.innerHTML=p.photoUrl
    ? `<img src="${esc(p.photoUrl)}" alt="${esc(nameOf(p))}">`
    : `<div class="placeholder">${esc(nameOf(p))}</div>`;

  document.querySelectorAll(".thumb").forEach((el,i)=>{
    el.classList.toggle("active", i===currentIndex);
  });
  // V5：縮圖列固定顯示，不再進行任何水平捲動。
  // 避免切換到最後幾位選手時瀏覽器連帶改變舞台的水平位置。
}
function next(){
  if(players.length>1) show(currentIndex+1);
}
function startAuto(){
  clearInterval(timer);
  if(players.length){
      timer=setInterval(next,AUTO_MS);
  }
}

onSnapshot(collection(db,"players"),snapshot=>{
  const oldId=players[currentIndex]?.id;
  players=[];
  snapshot.forEach(d=>players.push({id:d.id,...d.data()}));

  // PLAYER ADMIN 的名單來源就是 players 集合。
  // DISPLAY 完整顯示同一集合，不要求一定有照片、createdAt 或 cardStyle。
  players.sort((a,b)=>{
    const at = a.createdAt?.seconds ?? Number.MAX_SAFE_INTEGER;
    const bt = b.createdAt?.seconds ?? Number.MAX_SAFE_INTEGER;
    if(at !== bt) return at - bt;
    return String(a.name || a.battleName || "").localeCompare(
      String(b.name || b.battleName || ""),
      "zh-Hant"
    );
  });

  console.log(`[DISPLAY] 已從 PLAYER ADMIN 的 players 集合讀到 ${players.length} 位選手`, players);
  renderRoster();
  if(!players.length){
    clearInterval(timer);
    show(0);
    return;
  }
  const sameIndex=oldId ? players.findIndex(p=>p.id===oldId) : -1;
  currentIndex=sameIndex>=0 ? sameIndex : 0;
  show(currentIndex);
  startAuto();
},err=>{
  console.error(err);
  hero.innerHTML='<div class="placeholder">無法讀取選手資料，請重新整理頁面</div>';
});


const fullscreenStart=document.getElementById("fullscreenStart");
const fullscreenGo=document.getElementById("fullscreenGo");

async function enterFullscreen(){
  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen?.();
    }
  }catch(err){
    console.warn("Fullscreen blocked:",err);
  }
  fullscreenStart?.classList.add("hidden");
}
fullscreenGo?.addEventListener("click",enterFullscreen);
document.addEventListener("fullscreenchange",()=>{
  if(document.fullscreenElement) fullscreenStart?.classList.add("hidden");
});
window.addEventListener("load",()=>{
  setTimeout(async()=>{
    try{
      await document.documentElement.requestFullscreen?.();
      if(document.fullscreenElement) fullscreenStart?.classList.add("hidden");
    }catch(e){}
  },250);
});




const enterBattleBtn=document.getElementById("enterBattleBtn");
const enterAwardsBtn=document.getElementById("enterAwardsBtn");
const projectorShell=document.getElementById("projectorShell");
const projectorFrame=document.getElementById("projectorFrame");
const projectorHome=document.getElementById("projectorHome");

async function openProjector(url){
  // 這裡是由「進入比賽」的實際點擊直接觸發，因此瀏覽器允許進入真正 fullscreen。
  try{
    if(!document.fullscreenElement && document.documentElement.requestFullscreen){
      await document.documentElement.requestFullscreen();
    }
  }catch(err){
    console.warn("Fullscreen request blocked:",err);
  }
  projectorFrame.src=url;
  projectorShell.classList.add("active");
}

enterBattleBtn?.addEventListener("click",()=>openProjector("battle.html"));
enterAwardsBtn?.addEventListener("click",()=>openProjector("awards.html"));

projectorHome?.addEventListener("click",()=>{
  projectorFrame.src="about:blank";
  projectorShell.classList.remove("active");
  // 不退出 fullscreen，回到選手登場後仍保持滿版。
});

// 讓 iframe 裡的 BATTLE / AWARDS 可以要求外層切換畫面
window.addEventListener("message",(e)=>{
  if(e.data?.type==="projector:navigate" && e.data?.url){
    projectorFrame.src=e.data.url;
  }
  if(e.data?.type==="projector:home"){
    projectorFrame.src="about:blank";
    projectorShell.classList.remove("active");
  }
});


document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){show(currentIndex+1);startAuto()}
  if(e.key==="ArrowLeft"){show(currentIndex-1);startAuto()}
  if(e.key.toLowerCase()==="h") stage.classList.toggle("hide-ui");
  if(e.key.toLowerCase()==="f"){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
});
stage.addEventListener("dblclick",e=>{
  if(e.target.closest(".enter-btn")) return;
  stage.classList.toggle("hide-ui");
});
</script>
</body>
</html>
