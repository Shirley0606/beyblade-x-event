<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選手登場｜FINAL BATTLE 2026</title>
<meta name="theme-color" content="#03060c">
<style>
:root{
  --red:#ff2438;
  --red2:#8e0714;
  --blue:#168cff;
  --blue2:#0b2d78;
  --ink:#02040a;
  --panel:#070c14;
  --white:#f7fbff;
  --muted:#9da9bc;
  --line:#7f8ba0;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;min-height:100%;
  font-family:"Arial Black","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:#02040a;color:#fff;
}
body{overflow-x:hidden}
button,a{font:inherit}
button{cursor:pointer}
.screen{
  position:relative;
  width:100%;
  min-height:100vh;
  overflow:hidden;
  isolation:isolate;
  background:
    radial-gradient(circle at 13% 48%,rgba(255,20,40,.32) 0 1%,transparent 27%),
    radial-gradient(circle at 87% 48%,rgba(26,133,255,.30) 0 1%,transparent 28%),
    linear-gradient(115deg,#020309 0%,#060a12 48%,#020309 100%);
}
.screen::before{
  content:"";position:absolute;inset:0;z-index:-5;pointer-events:none;
  background:
    repeating-linear-gradient(115deg,transparent 0 68px,rgba(255,255,255,.018) 69px 70px),
    repeating-linear-gradient(0deg,transparent 0 31px,rgba(255,255,255,.012) 32px 33px);
}
.energy{
  position:absolute;inset:68px 0 120px;z-index:-4;pointer-events:none;overflow:hidden
}
.energy::before,.energy::after{
  content:"";position:absolute;top:10%;width:63vw;height:63vw;border-radius:50%;
  filter:blur(.1px);
}
.energy::before{
  left:-38vw;
  border:2px solid rgba(255,35,52,.62);
  box-shadow:
    0 0 24px rgba(255,22,43,.8),
    0 0 75px rgba(255,22,43,.38),
    inset 0 0 80px rgba(255,22,43,.18);
  animation:spin 18s linear infinite;
}
.energy::after{
  right:-38vw;
  border:2px solid rgba(28,135,255,.65);
  box-shadow:
    0 0 24px rgba(26,126,255,.85),
    0 0 78px rgba(26,126,255,.4),
    inset 0 0 80px rgba(26,126,255,.18);
  animation:spinBack 20s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinBack{to{transform:rotate(-360deg)}}

.topbar{
  height:72px;display:grid;grid-template-columns:315px 1fr auto;
  align-items:stretch;border-bottom:1px solid rgba(145,160,184,.18);
  background:linear-gradient(180deg,rgba(3,6,12,.98),rgba(4,7,13,.92));
  box-shadow:0 14px 35px rgba(0,0,0,.34);position:relative;z-index:20
}
.brand{
  display:flex;align-items:center;gap:14px;padding:0 24px 0 28px;
  clip-path:polygon(0 0,100% 0,88% 100%,0 100%);
  background:linear-gradient(110deg,#080d16,#060910 72%,#111826)
}
.brand-mark{
  width:46px;height:46px;border-radius:50%;position:relative;
  border:3px solid #d9e4f4;
  box-shadow:0 0 0 5px #101725,0 0 22px rgba(255,255,255,.18)
}
.brand-mark::before,.brand-mark::after{
  content:"";position:absolute;inset:8px;border-radius:50%;
  border:4px solid var(--red);transform:rotate(-24deg)
}
.brand-mark::after{inset:2px;border-color:transparent var(--blue) transparent var(--blue);transform:rotate(33deg)}
.brand-text strong{display:block;font-size:22px;letter-spacing:.12em;font-style:italic}
.brand-text small{display:block;font-size:10px;color:#a8b2c4;letter-spacing:.25em;margin-top:2px}
.nav{
  display:flex;align-items:center;justify-content:center;gap:46px;
  font-family:"PingFang TC","Microsoft JhengHei",sans-serif;
}
.nav span{font-size:14px;color:#d9dfe8;letter-spacing:.09em;white-space:nowrap}
.nav .active{color:#fff;text-shadow:0 0 16px rgba(255,49,61,.9);position:relative}
.nav .active::after{
  content:"";position:absolute;left:12%;right:12%;height:2px;bottom:-26px;
  background:linear-gradient(90deg,transparent,var(--red),transparent);
  box-shadow:0 0 14px var(--red)
}
.top-action{
  display:flex;align-items:center;padding-right:26px
}
.rank-pill{
  min-width:116px;height:42px;display:flex;align-items:center;justify-content:center;gap:9px;
  border:1px solid rgba(160,174,195,.28);color:#dde6f2;text-decoration:none;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);
  background:linear-gradient(180deg,#111722,#080c14);
  font-size:13px;letter-spacing:.08em
}
.rank-pill::before{content:"◈";color:#fff}

.stage{width:min(1240px,calc(100% - 28px));margin:0 auto;padding:12px 0 128px}
.title-wrap{text-align:center;margin:0 auto 5px;position:relative;z-index:4}
.title{
  margin:0;
  font-size:clamp(46px,5.6vw,82px);
  line-height:1;
  font-style:italic;
  letter-spacing:.05em;
  transform:skew(-4deg);
  text-shadow:
    0 4px 0 #596171,
    0 8px 18px rgba(0,0,0,.9),
    0 0 22px rgba(255,255,255,.09);
}
.title::before,.title::after{
  content:"";display:inline-block;vertical-align:middle;width:72px;height:12px;margin:0 22px;
  clip-path:polygon(0 38%,72% 38%,72% 0,100% 50%,72% 100%,72% 62%,0 62%);
}
.title::before{background:linear-gradient(90deg,transparent,var(--red));transform:scaleX(-1)}
.title::after{background:linear-gradient(90deg,transparent,var(--blue))}
.subtitle{
  margin-top:8px;color:#d7dce4;font-size:14px;letter-spacing:.32em;
  font-family:"PingFang TC","Microsoft JhengHei",sans-serif
}
.subtitle b{color:#ff5564}.subtitle i{color:#52a8ff}

.hero-shell{
  position:relative;margin:4px auto 0;max-width:980px;
  filter:drop-shadow(0 22px 25px rgba(0,0,0,.55))
}
.hero-shell::before{
  content:"";position:absolute;inset:-14px -18px;z-index:-2;
  background:linear-gradient(90deg,#566276 0 7%,#161f2c 10% 42%,#7b8798 50%,#172131 58% 90%,#5c687a 93%);
  clip-path:polygon(5% 0,40% 0,42% 3%,58% 3%,60% 0,95% 0,100% 11%,100% 89%,95% 100%,60% 100%,58% 97%,42% 97%,40% 100%,5% 100%,0 89%,0 11%);
}
.hero-shell::after{
  content:"";position:absolute;inset:-8px -11px;z-index:-1;
  background:#02060c;
  clip-path:polygon(5% 0,40% 0,42% 3%,58% 3%,60% 0,95% 0,100% 11%,100% 89%,95% 100%,60% 100%,58% 97%,42% 97%,40% 100%,5% 100%,0 89%,0 11%);
}
.hero{
  position:relative;height:365px;overflow:hidden;
  background:
    linear-gradient(90deg,rgba(69,0,8,.9),rgba(4,8,15,.88) 43%,rgba(4,12,27,.88) 62%,rgba(1,30,76,.85)),
    #040811;
  clip-path:polygon(5% 0,95% 0,100% 12%,100% 88%,95% 100%,5% 100%,0 88%,0 12%);
  border:1px solid rgba(255,255,255,.12)
}
.hero::before{
  content:"";position:absolute;left:0;top:0;width:51%;height:100%;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 38% 50%,transparent 0 19%,rgba(255,30,49,.32) 20% 20.5%,transparent 21% 29%,rgba(255,35,50,.22) 30% 30.7%,transparent 31%),
    repeating-conic-gradient(from 0deg at 38% 50%,rgba(255,38,51,.22) 0 3deg,transparent 3deg 13deg);
  filter:drop-shadow(0 0 15px rgba(255,23,39,.45));
  animation:slowSpin 20s linear infinite;
}
.hero::after{
  content:"";position:absolute;right:0;top:0;width:48%;height:100%;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 62% 50%,transparent 0 22%,rgba(28,132,255,.3) 23% 23.6%,transparent 24% 32%,rgba(28,132,255,.2) 33% 33.7%,transparent 34%),
    repeating-conic-gradient(from 0deg at 62% 50%,rgba(35,137,255,.2) 0 3deg,transparent 3deg 14deg);
  filter:drop-shadow(0 0 15px rgba(30,126,255,.5));
  animation:slowSpinBack 22s linear infinite;
}
@keyframes slowSpin{to{transform:rotate(360deg)}}
@keyframes slowSpinBack{to{transform:rotate(-360deg)}}

.hero-photo-wrap{
  position:absolute;left:0;top:0;width:51%;height:100%;z-index:2;overflow:hidden
}
.hero-photo{
  width:100%;height:100%;object-fit:contain;object-position:53% 100%;
  filter:contrast(1.04) saturate(.98) drop-shadow(0 18px 18px rgba(0,0,0,.55));
  transform-origin:bottom center;animation:photoIn .55s ease
}
.hero-photo-wrap::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(25,0,4,.12),transparent 48%,rgba(5,9,16,.94) 98%),
             linear-gradient(0deg,rgba(2,4,8,.55),transparent 29%)
}
.hero-placeholder{
  height:100%;display:grid;place-items:center;font-size:70px;color:#6d788a;
  background:linear-gradient(135deg,#22060a,#050b14)
}
.hero-copy{
  position:absolute;left:47.5%;right:6%;top:0;bottom:0;z-index:4;
  display:flex;flex-direction:column;justify-content:center;padding:26px 0 34px
}
.label{
  align-self:flex-start;padding:5px 22px 6px 16px;
  border-top:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.14);
  border-left:3px solid var(--red);font-size:15px;font-style:italic;letter-spacing:.14em;
  background:linear-gradient(90deg,rgba(47,12,18,.85),transparent)
}
.name-panel{
  margin-top:5px;position:relative;padding:10px 20px 12px 22px;
  transform:skew(-7deg);
  border-top:1px solid rgba(255,255,255,.13);border-bottom:1px solid rgba(255,255,255,.13);
  background:linear-gradient(90deg,rgba(105,5,18,.82),rgba(24,7,14,.55) 52%,rgba(8,29,71,.55));
  box-shadow:inset 0 0 28px rgba(255,23,41,.08)
}
.name-panel::before{
  content:"";position:absolute;left:-8px;top:0;bottom:0;width:5px;background:var(--red);
  box-shadow:0 0 14px rgba(255,36,56,.75)
}
.hero-name{
  transform:skew(7deg);
  font-size:clamp(42px,5.4vw,74px);line-height:1;font-style:italic;
  font-weight:1000;letter-spacing:.04em;white-space:normal;word-break:keep-all;
  text-shadow:0 4px 0 rgba(36,40,48,.9),0 0 22px rgba(255,255,255,.08);
  animation:nameIn .45s ease
}

.slogan{
  position:absolute;left:35%;right:10%;bottom:8px;z-index:5;
  text-align:center;font-size:16px;letter-spacing:.2em;font-style:italic;color:#f2f5f8;
  text-shadow:0 0 14px rgba(255,255,255,.15)
}
.slogan::before{content:"<<<";color:#ff394b;margin-right:12px}
.slogan::after{content:">>>";color:#3e9aff;margin-left:12px}
@keyframes photoIn{from{opacity:0;transform:scale(1.04) translateX(-12px)}to{opacity:1;transform:none}}
@keyframes nameIn{from{opacity:0;transform:skew(7deg) translateX(25px)}to{opacity:1;transform:skew(7deg)}}

.roster-title{
  display:flex;align-items:center;justify-content:center;gap:20px;margin:15px 0 9px;
  color:#c7d0dc;font-size:13px;letter-spacing:.16em
}
.roster-title::before,.roster-title::after{
  content:"";width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--red))
}
.roster-title::after{background:linear-gradient(90deg,var(--blue),transparent)}

.roster-wrap{position:relative;display:flex;align-items:center;gap:10px}
.scroll-arrow{
  flex:0 0 42px;height:82px;border:0;background:transparent;color:#e5ebf4;font-size:45px;
  text-shadow:0 0 14px rgba(255,255,255,.2)
}
.roster{
  flex:1;display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;
  scroll-behavior:smooth;scrollbar-width:none
}
.roster::-webkit-scrollbar{display:none}
.thumb{
  flex:0 0 183px;height:86px;position:relative;display:grid;grid-template-columns:70px 1fr;
  overflow:hidden;cursor:pointer;transform:skew(-5deg);
  background:linear-gradient(130deg,#0b1019,#080b12);
  border:1px solid #536071;
  box-shadow:inset 0 0 0 2px #070b12,0 8px 17px rgba(0,0,0,.35);
  transition:.2s
}
.thumb:nth-child(odd){border-color:#8b3340}
.thumb:nth-child(even){border-color:#315e96}
.thumb.active{
  transform:skew(-5deg) translateY(-3px);
  border-color:#eef5ff;
  box-shadow:
    inset 0 0 0 2px #080b12,
    0 0 13px rgba(255,42,59,.36),
    0 0 22px rgba(32,137,255,.24)
}
.thumb-media{height:100%;overflow:hidden;transform:skew(5deg);margin-left:-4px}
.thumb img{width:76px;height:100%;object-fit:cover;object-position:center 20%;display:block}
.thumb .ph{width:76px;height:100%;display:grid;place-items:center;background:#111722;color:#687487;font-size:23px}
.thumb-info{
  min-width:0;display:flex;flex-direction:column;justify-content:center;padding:6px 7px 6px 9px;
  transform:skew(5deg)
}
.thumb-name{
  font-size:14px;font-style:italic;font-weight:900;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical
}
.thumb-no{font-size:10px;letter-spacing:.12em;margin-top:5px;color:#b6bfcc}
.thumb-accent{
  position:absolute;right:5px;bottom:7px;width:27px;height:4px;
  background:repeating-linear-gradient(115deg,var(--red) 0 5px,transparent 5px 8px)
}
.thumb:nth-child(even) .thumb-accent{background:repeating-linear-gradient(115deg,var(--blue) 0 5px,transparent 5px 8px)}
.empty{
  width:100%;text-align:center;padding:34px;color:#78869b;border:1px dashed #39475c;
  font-family:"PingFang TC","Microsoft JhengHei",sans-serif
}

.enter-area{
  position:fixed;left:0;right:0;bottom:0;height:108px;z-index:25;
  display:grid;grid-template-columns:minmax(220px,1fr) 360px minmax(220px,1fr);
  align-items:center;gap:30px;padding:0 34px;
  background:linear-gradient(180deg,rgba(4,6,10,.28),rgba(4,6,10,.97) 34%);
  border-top:1px solid rgba(129,143,164,.15)
}
.status-box{
  height:58px;display:flex;align-items:center;gap:13px;padding:0 20px;
  border:1px solid rgba(132,148,170,.29);
  background:linear-gradient(135deg,#101621,#070a10);
  clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);
  font-family:"PingFang TC","Microsoft JhengHei",sans-serif
}
.status-box.right{justify-self:end;min-width:230px}
.status-icon{
  width:30px;height:30px;border:2px solid #c1cad7;border-radius:50%;display:grid;place-items:center;
  color:#dfe7f2;font-size:14px
}
.status-text small{display:block;font-size:10px;color:#93a0b2;letter-spacing:.1em}
.status-text strong{display:block;font-size:13px;margin-top:2px}
.enter-btn{
  height:66px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;
  font-size:27px;letter-spacing:.22em;font-style:italic;font-weight:1000;
  border:2px solid #7f8997;
  background:linear-gradient(180deg,#c21520 0%,#8f0914 45%,#58050b 100%);
  box-shadow:
    inset 0 0 0 4px #25070b,
    inset 0 0 0 6px rgba(255,255,255,.14),
    0 0 18px rgba(255,22,36,.45);
  clip-path:polygon(8% 0,92% 0,100% 23%,100% 77%,92% 100%,8% 100%,0 77%,0 23%);
  transition:.2s
}
.enter-btn:hover{filter:brightness(1.16);transform:translateY(-2px)}
.enter-btn::before{content:"〈";font-size:34px;margin-right:17px;color:#ff6068}
.enter-btn::after{content:"〉";font-size:34px;margin-left:17px;color:#ff6068}
.flash{
  position:absolute;inset:0;z-index:10;pointer-events:none;opacity:0;
  background:linear-gradient(103deg,transparent 32%,rgba(255,255,255,.30) 49%,transparent 66%)
}
.flash.go{animation:flash .52s ease}
@keyframes flash{0%{opacity:0;transform:translateX(-45%)}35%{opacity:.75}100%{opacity:0;transform:translateX(45%)}}

@media(max-width:1050px){
  .topbar{grid-template-columns:250px 1fr auto}.nav{gap:22px}.brand{padding-left:16px}
  .hero-shell{max-width:900px}.hero{height:350px}
  .enter-area{grid-template-columns:1fr 330px 1fr;gap:15px;padding:0 18px}
}
@media(max-width:820px){
  .topbar{height:62px;grid-template-columns:1fr auto}.nav{display:none}.brand{clip-path:none}
  .rank-pill{min-width:88px}
  .stage{padding-top:10px}.title{font-size:45px}.title::before,.title::after{width:38px;margin:0 8px}
  .hero-shell{margin-inline:10px}.hero{height:520px;clip-path:polygon(4% 0,96% 0,100% 7%,100% 93%,96% 100%,4% 100%,0 93%,0 7%)}
  .hero-photo-wrap{width:100%;height:64%}
  .hero-photo-wrap::after{background:linear-gradient(0deg,#060a12 0,rgba(6,10,18,.15) 45%,transparent 74%)}
  .hero-copy{left:7%;right:7%;top:51%;bottom:8%;padding:0;justify-content:center}
  .label{font-size:12px}.hero-name{font-size:43px}.name-panel{padding:9px 14px}
  .slogan{left:8%;right:8%;font-size:12px}
  .thumb{flex-basis:170px}
  .enter-area{height:92px;grid-template-columns:1fr 280px 1fr;padding:0 10px}
  .status-box{display:none}.enter-btn{grid-column:2;font-size:21px;height:59px}
}
@media(max-width:540px){
  .brand-text strong{font-size:18px}.brand-text small{display:none}.brand-mark{width:38px;height:38px}
  .title{font-size:36px}.title::before,.title::after{display:none}.subtitle{font-size:11px;letter-spacing:.18em}
  .stage{width:calc(100% - 10px);padding-bottom:100px}.hero-shell{margin-inline:2px}
  .hero{height:480px}.hero-photo-wrap{height:61%}.hero-copy{top:48%}
  .hero-name{font-size:37px}.slogan{font-size:10px;letter-spacing:.09em}
  .scroll-arrow{display:none}.thumb{flex-basis:155px;height:80px;grid-template-columns:62px 1fr}
  .thumb img,.thumb .ph{width:68px}.thumb-name{font-size:13px}
  .enter-area{grid-template-columns:1fr;padding:0 12px}.enter-btn{grid-column:1;font-size:19px}
}

.hero[data-style="red"]{--accent:#ff2438;--accent2:#8e0714;--glow:rgba(255,36,56,.72)}
.hero[data-style="blue"]{--accent:#168cff;--accent2:#0b2d78;--glow:rgba(22,140,255,.75)}
.hero[data-style="blue"]{
  background:linear-gradient(90deg,rgba(1,25,68,.92),rgba(4,8,15,.88) 43%,rgba(4,12,27,.88) 62%,rgba(1,37,93,.88)),#040811;
}
.hero[data-style="blue"]::before{
  background:
    radial-gradient(circle at 38% 50%,transparent 0 19%,rgba(28,132,255,.34) 20% 20.5%,transparent 21% 29%,rgba(28,132,255,.24) 30% 30.7%,transparent 31%),
    repeating-conic-gradient(from 0deg at 38% 50%,rgba(35,137,255,.24) 0 3deg,transparent 3deg 13deg);
  filter:drop-shadow(0 0 15px rgba(30,126,255,.5));
}
.hero[data-style="blue"]::after{
  background:
    radial-gradient(circle at 62% 50%,transparent 0 22%,rgba(28,132,255,.3) 23% 23.6%,transparent 24% 32%,rgba(28,132,255,.2) 33% 33.7%,transparent 34%),
    repeating-conic-gradient(from 0deg at 62% 50%,rgba(35,137,255,.2) 0 3deg,transparent 3deg 14deg);
}
.hero[data-style="blue"] .label{border-left-color:#168cff;background:linear-gradient(90deg,rgba(7,27,64,.88),transparent)}
.hero[data-style="blue"] .name-panel{background:linear-gradient(90deg,rgba(6,58,141,.86),rgba(6,20,48,.64) 54%,rgba(6,44,105,.62))}
.hero[data-style="blue"] .name-panel::before{background:#168cff;box-shadow:0 0 14px rgba(22,140,255,.8)}
.hero[data-style="blue"] .hero-name{text-shadow:0 4px 0 rgba(26,37,56,.92),0 0 24px rgba(22,140,255,.35)}
.thumb[data-style="blue"]{border-color:#315e96!important}
.thumb[data-style="red"]{border-color:#8b3340!important}
.thumb.active[data-style="blue"]{box-shadow:inset 0 0 0 2px #080b12,0 0 18px rgba(32,137,255,.48)!important}
.thumb.active[data-style="red"]{box-shadow:inset 0 0 0 2px #080b12,0 0 18px rgba(255,42,59,.48)!important}

</style>
</head>
<body>
<div class="screen">
  <div class="energy"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-text">
        <strong>FINAL BATTLE</strong>
        <small>BEYBLADE EVENT · 2026</small>
      </div>
    </div>

    <nav class="nav" aria-label="頁面導覽">
      <span>首頁</span>
      <span>賽事資訊</span>
      <span class="active">選手展示</span>
      <span>賽程表</span>
      <span>最新消息</span>
    </nav>

    <div class="top-action">
      <a class="rank-pill" href="battle.html">進入比賽</a>
    </div>
  </header>

  <main class="stage">
    <div class="title-wrap">
      <h1 class="title">選手登場</h1>
      <div class="subtitle"><b>///</b> 頂尖對決・旋出榮耀 <i>///</i></div>
    </div>

    <section class="hero-shell" aria-live="polite">
      <div class="hero" id="hero" data-style="red">
        <div class="flash" id="flash"></div>

        <div class="hero-photo-wrap" id="photoZone">
          <div class="hero-placeholder">—</div>
        </div>

        <div class="hero-copy">
          <div class="label">戰鬥名號</div>
          <div class="name-panel">
            <div class="hero-name" id="heroName">等待選手登錄</div>
          </div>

        </div>

        <div class="slogan">全力以赴・旋出勝利！</div>
      </div>
    </section>

    <div class="roster-title">已報名選手</div>

    <div class="roster-wrap">
      <button class="scroll-arrow" id="rosterPrev" aria-label="向左捲動">‹</button>
      <div class="roster" id="roster"></div>
      <button class="scroll-arrow" id="rosterNext" aria-label="向右捲動">›</button>
    </div>
    <div class="empty" id="empty" style="display:none">目前還沒有選手完成登錄</div>
  </main>

  <footer class="enter-area">
    <div class="status-box">
      <div class="status-icon">◎</div>
      <div class="status-text">
        <small>已登錄選手</small>
        <strong id="playerCount">0 位</strong>
      </div>
    </div>

    <a class="enter-btn" href="battle.html">進入比賽</a>

    <div class="status-box right">
      <div class="status-icon">⌁</div>
      <div class="status-text">
        <small>展示模式</small>
        <strong>10 秒自動輪播</strong>
      </div>
    </div>
  </footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCPkvZj2_Z7ZgiG0itfP2YCjTvDkaSaPew",
  authDomain:"beyblade-x-event.firebaseapp.com",
  projectId:"beyblade-x-event",
  storageBucket:"beyblade-x-event.firebasestorage.app",
  messagingSenderId:"866394169939",
  appId:"1:866394169939:web:a73222040a99a433425ca6"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const photoZone=document.getElementById("photoZone");
const heroName=document.getElementById("heroName");
const roster=document.getElementById("roster");
const empty=document.getElementById("empty");
const flash=document.getElementById("flash");
const hero=document.getElementById("hero");
const playerCount=document.getElementById("playerCount");

let players=[];
let currentIndex=0;
let timer=null;
let resumeTimeout=null;
let initialized=false;
let knownIds=new Set();

const AUTO_MS=10000;
const NEW_PLAYER_MS=8000;

function esc(v=""){
  return String(v).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}
function pName(p){return p?.battleName||p?.name||"未命名選手"}

function flashIt(){
  flash.classList.remove("go");
  void flash.offsetWidth;
  flash.classList.add("go");
}

function show(index,manual=false){
  if(!players.length){
    photoZone.innerHTML='<div class="hero-placeholder">—</div>';
    heroName.textContent="等待選手登錄";
    return;
  }

  currentIndex=(index+players.length)%players.length;
  const p=players[currentIndex];
  const cardStyle = p.cardStyle === "blue" ? "blue" : "red";
  hero.dataset.style = cardStyle;

  photoZone.innerHTML=p.photoUrl
    ? `<img class="hero-photo" src="${esc(p.photoUrl)}" alt="${esc(pName(p))}">`
    : `<div class="hero-placeholder">—</div>`;

  heroName.style.animation="none";
  void heroName.offsetWidth;
  heroName.style.animation="";
  heroName.textContent=pName(p);

  document.querySelectorAll(".thumb").forEach((el,i)=>{
    el.classList.toggle("active",i===currentIndex);
  });

  document.querySelector(`.thumb[data-index="${currentIndex}"]`)?.scrollIntoView({
    behavior:"smooth",block:"nearest",inline:"center"
  });

  flashIt();
  if(manual) startAuto();
}

function renderRoster(){
  roster.innerHTML="";
  empty.style.display=players.length?"none":"block";
  playerCount.textContent=`${players.length} 位`;

  players.forEach((p,i)=>{
    const el=document.createElement("div");
    el.className="thumb";
    el.dataset.index=i;
    el.dataset.style=p.cardStyle === "blue" ? "blue" : "red";
    el.setAttribute("role","button");
    el.setAttribute("tabindex","0");
    el.innerHTML=`
      <div class="thumb-media">
        ${p.photoUrl
          ? `<img src="${esc(p.photoUrl)}" alt="${esc(pName(p))}">`
          : `<div class="ph">—</div>`}
      </div>
      <div class="thumb-info">
        <div class="thumb-name">${esc(pName(p))}</div>
      </div>
      <div class="thumb-accent" style="background:${p.cardStyle === 'blue' ? 'repeating-linear-gradient(115deg,#168cff 0 5px,transparent 5px 8px)' : 'repeating-linear-gradient(115deg,#ff2438 0 5px,transparent 5px 8px)'}"></div>
    `;
    el.addEventListener("click",()=>show(i,true));
    el.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){e.preventDefault();show(i,true)}
    });
    roster.appendChild(el);
  });
}

function next(){
  if(players.length>1) show(currentIndex+1);
}
function startAuto(){
  clearInterval(timer);
  clearTimeout(resumeTimeout);
  if(players.length>1) timer=setInterval(next,AUTO_MS);
}
function spotlightNew(index){
  clearInterval(timer);
  clearTimeout(resumeTimeout);
  show(index);
  resumeTimeout=setTimeout(startAuto,NEW_PLAYER_MS);
}

hero.addEventListener("mouseenter",()=>clearInterval(timer));
hero.addEventListener("mouseleave",startAuto);

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") show(currentIndex-1,true);
  if(e.key==="ArrowRight") show(currentIndex+1,true);
});

document.getElementById("rosterPrev").addEventListener("click",()=>{
  roster.scrollBy({left:-390,behavior:"smooth"});
});
document.getElementById("rosterNext").addEventListener("click",()=>{
  roster.scrollBy({left:390,behavior:"smooth"});
});

const q=query(collection(db,"players"),orderBy("createdAt","asc"));

onSnapshot(q,snapshot=>{
  const newPlayers=[];
  snapshot.forEach(d=>newPlayers.push({id:d.id,...d.data()}));

  const previousIds=knownIds;
  players=newPlayers;
  renderRoster();

  if(!players.length){
    knownIds=new Set();
    initialized=false;
    clearInterval(timer);
    show(0);
    return;
  }

  const currentIds=new Set(players.map(p=>p.id));

  if(!initialized){
    initialized=true;
    knownIds=currentIds;
    currentIndex=0;
    show(0);
    startAuto();
    return;
  }

  const added=players.filter(p=>!previousIds.has(p.id));
  knownIds=currentIds;

  if(added.length){
    const newest=added[added.length-1];
    const idx=players.findIndex(p=>p.id===newest.id);
    spotlightNew(idx);
  }else{
    if(currentIndex>=players.length) currentIndex=0;
    show(currentIndex);
    startAuto();
  }
},err=>{
  console.error("Firestore 讀取失敗：",err);
  empty.style.display="block";
  empty.textContent="無法讀取選手資料，請確認 Firebase Firestore 規則與網路連線。";
});
</script>
</body>
</html>
